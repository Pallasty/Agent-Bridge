# GitLab CI/CD for agent-bridge
#
# Replicates the CI logic in .github/workflows/ci.yml on GitLab Shared
# Runners. Coverage is **Linux x86_64 only** on the free tier.
#
# Distribution policy (2026-07-03): agent-bridge ships SOURCE ONLY — no
# prebuilt binaries and no release pipelines. Users install with
# `cargo install --git` or a source checkout (see README "Install").
# Version tags (v*) are source markers and intentionally trigger nothing.
#
# Triggers:
#   - merge_request_event / push to master  → test:linux
#
# Notes:
#   - `image: rust:trixie` ships Rust stable; `rust-toolchain.toml`
#     pins channel to `stable`, so this matches.
#   - Cargo cache is keyed on Cargo.lock — invalidates on dep bumps.

stages:
  - test

variables:
  CARGO_TERM_COLOR: "always"
  CARGO_INCREMENTAL: "0"
  RUST_BACKTRACE: "1"
  CARGO_HOME: "$CI_PROJECT_DIR/.cargo"

# ── Reusable scaffolding ────────────────────────────────────────────────────

.rust-base:
  image: rust:trixie
  cache:
    key:
      files:
        - Cargo.lock
    paths:
      - .cargo/
      - target/
  before_script:
    - rustc --version && cargo --version

# ── CI: PR-time build + test ────────────────────────────────────────────────

test:linux:
  extends: .rust-base
  stage: test
  rules:
    - if: $CI_COMMIT_TAG
      when: never
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "master"
  timeout: 25m
  script:
    - cargo build --workspace --all-targets
    - AGENT_BRIDGE_EMBED_BACKEND=hash cargo test --workspace --no-fail-fast
    # Clippy emits warnings only — do not gate the pipeline.
    - cargo clippy --workspace --all-targets -- -W clippy::all || true
