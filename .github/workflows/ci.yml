name: CI

# PR-time sanity check: build + test on both Linux and macOS so we don't
# tag a release that fails to build on either platform. The existing
# `verify-warp-integration.yml` covers master-push regression on Linux;
# this workflow's job is matrix coverage on incoming changes.

on:
  pull_request:
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "memory_snapshots/**"
      - ".gitignore"
      - "LICENSE"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1

jobs:
  build-and-test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-14]

    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          key: ci-${{ matrix.os }}

      - name: Build workspace
        run: cargo build --workspace --all-targets

      - name: Run tests
        run: cargo test --workspace --no-fail-fast

      - name: Clippy (warnings only on PR; do not gate)
        run: cargo clippy --workspace --all-targets -- -W clippy::all || true
