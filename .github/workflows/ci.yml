name: CI

# Sanity check: build + test on both Linux and macOS so we don't ship a
# master commit that fails to build on either platform.
#
# Triggers:
#   - pull_request  — pre-merge gate (matrix coverage on incoming PRs)
#   - push to master — post-merge safety net (P24, 2026-05-13). Direct
#     pushes to master bypass PR review, so this catches broken-HEAD
#     commits like `f88e5ef` where an enum dispatch went in without
#     its target fn definition. `verify-warp-integration.yml` already
#     covered Linux on master push; this adds macOS to that coverage.
#
# Branch protection (recommended but not enforced by repo):
#   Enable "Require status checks to pass before merging" on master
#   with this workflow + verify-warp-integration as required checks.
#   Without that, a failing CI on master is detected but not blocking.

on:
  pull_request:
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "memory_snapshots/**"
      - ".gitignore"
      - "LICENSE"
  push:
    branches:
      - master
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "memory_snapshots/**"
      - ".gitignore"
      - "LICENSE"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1

jobs:
  composition-root-governance:
    name: CLI composition-root governance
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Resolve comparison base
        id: governance-base
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            base="$PR_BASE_SHA"
          elif [[ "$EVENT_NAME" == "push" && ! "$PUSH_BEFORE_SHA" =~ ^0+$ ]]; then
            base="$PUSH_BEFORE_SHA"
          else
            base="HEAD^"
          fi
          echo "base=$base" >> "$GITHUB_OUTPUT"

      - name: Validate composition-root governance
        run: scripts/check-cli-composition-root-governance.sh "${{ steps.governance-base.outputs.base }}"

  build-and-test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-14]

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python 3.9 contract floor
        uses: actions/setup-python@v6
        with:
          python-version: "3.9"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          key: ci-${{ matrix.os }}

      - name: Build workspace
        run: cargo build --workspace --all-targets

      - name: Run tests
        env:
          # Keep save/search on one deterministic encoder during parallel tests.
          AGENT_BRIDGE_EMBED_BACKEND: hash
        run: cargo test --workspace --no-fail-fast

      - name: Run benefit dogfood contract tests
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python3 -m unittest -v tests.test_agent_bridge_benefit_dogfood

      - name: Clippy (warnings only on PR; do not gate)
        run: cargo clippy --workspace --all-targets -- -W clippy::all || true
