[workspace]

[package]
name = "ab-codebase-index-a1"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT"
publish = false

[features]
default = []
staged-native = ["ab-store/codebase-index-bounded-native-a1"]

[dependencies]
ab-store = { path = "../../../crates/store", default-features = false }
clap = { version = "4", features = ["derive"] }
libc = "0.2"
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
thiserror = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[build-dependencies]
sha2 = "0.10"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
