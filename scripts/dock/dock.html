<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Claude · dock</title>
<style>
  :root {
    --bg: #0e1116; --panel: #161b22; --line: #232a33;
    --fg: #e6edf3; --dim: #8b949e; --faint: #6e7681;
    --ok: #2ea043; --info: #4493f8; --warn: #d29922; --bad: #f85149; --idle: #6e7681;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg);
    font: 12px/1.45 -apple-system, "Segoe UI", "Noto Sans CJK SC", system-ui, sans-serif;
    -webkit-user-select: none; user-select: none; overflow: hidden; }
  #app { display: flex; flex-direction: column; height: 100%; }

  /* header / the face */
  header { display: flex; align-items: center; gap: 10px; padding: 12px 12px 10px;
    border-bottom: 1px solid var(--line); }
  .orb { width: 26px; height: 26px; border-radius: 50%; flex: 0 0 auto;
    background: radial-gradient(circle at 35% 30%, #fff6, var(--mood, var(--info)) 60%, #0000 100%);
    box-shadow: 0 0 0 2px #0006, 0 0 var(--glow, 14px) 2px var(--mood, var(--info));
    animation: breathe var(--breath-dur, 3.6s) ease-in-out infinite;
    transition: box-shadow .6s ease; }
  /* breath amplitude + speed are driven by avatar cortex intensity (set in JS) */
  @keyframes breathe { 0%,100% { transform: scale(1); opacity: .80; }
                       50% { transform: scale(var(--breath-amp, 1.12)); opacity: 1; } }
  .who { flex: 1 1 auto; min-width: 0; }
  .who .name { font-weight: 600; letter-spacing: .2px; }
  .who .name .node { color: var(--dim); font-weight: 400; }
  .who .reason { color: var(--dim); font-size: 11px; white-space: nowrap;
    overflow: hidden; text-overflow: ellipsis; }
  .who .cortex { color: var(--faint); font-size: 10px; white-space: nowrap;
    overflow: hidden; text-overflow: ellipsis; letter-spacing: .2px; }
  .mode-badge { font-size: 10px; color: var(--faint); border: 1px solid var(--line);
    border-radius: 999px; padding: 1px 7px; flex: 0 0 auto; }

  main { flex: 1 1 auto; overflow-y: auto; padding: 4px 0 6px; }
  main::-webkit-scrollbar { width: 7px; }
  main::-webkit-scrollbar-thumb { background: #30363d; border-radius: 4px; }
  section { padding: 8px 12px 4px; }
  .sec-h { font-size: 10px; text-transform: uppercase; letter-spacing: .8px;
    color: var(--faint); margin-bottom: 5px; display: flex; justify-content: space-between; }
  .row { display: flex; align-items: baseline; gap: 7px; padding: 3px 0; }
  .dot { width: 7px; height: 7px; border-radius: 50%; flex: 0 0 auto; align-self: center;
    background: var(--idle); }
  .dot.live { background: var(--ok); box-shadow: 0 0 6px var(--ok); }
  .grow { flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis;
    white-space: nowrap; }
  .age { color: var(--faint); font-size: 10px; flex: 0 0 auto; }
  .sev { width: 3px; align-self: stretch; border-radius: 2px; background: var(--idle); }
  .sev.success { background: var(--ok); } .sev.info { background: var(--info); }
  .sev.warn, .sev.warning { background: var(--warn); }
  .sev.error, .sev.critical { background: var(--bad); }
  .ntitle { font-weight: 500; }
  .muted { color: var(--dim); }
  .empty { color: var(--faint); font-style: italic; padding: 2px 0; }

  /* approvals — clickable (Slice 1): the row records the human's decision */
  .approval { border: 1px solid #5a4a17; background: #20180a; border-radius: 7px;
    padding: 7px 9px; margin-bottom: 6px; }
  .approval .k { color: var(--warn); font-weight: 600; }
  .approval .ap-row { display: flex; justify-content: space-between; gap: 6px; align-items: baseline; }
  .approval .ap-sum { font-size: 10px; color: var(--dim); overflow: hidden;
    text-overflow: ellipsis; white-space: nowrap; }
  .approval .ap-btns { display: flex; gap: 6px; margin-top: 6px; }
  .approval button { flex: 1; font: inherit; font-size: 11px; padding: 3px 0;
    border-radius: 5px; cursor: pointer; border: 1px solid var(--line);
    background: #1b2230; color: var(--fg); transition: background .15s ease; }
  .approval .ap-yes { border-color: #2e6b3a; color: #a6e3a1; }
  .approval .ap-yes:hover { background: #16301c; }
  .approval .ap-no { border-color: #6b2e34; color: #f3a0a8; }
  .approval .ap-no:hover { background: #301619; }
  .approval button:disabled { opacity: .5; cursor: default; }
  .approval.decided { opacity: .8; }
  .approval.decided .k.yes { color: var(--ok); }
  .approval.decided .k.no { color: var(--bad); }

  footer { border-top: 1px solid var(--line); padding: 7px 12px;
    display: flex; gap: 12px; color: var(--faint); font-size: 10px; flex-wrap: wrap; }
  footer .hb { color: var(--dim); }
  footer .hb b { color: var(--fg); font-weight: 600; }
  .pill { padding: 0 5px; border-radius: 4px; }
  .pill.ok { color: var(--ok); } .pill.bad { color: var(--bad); }

  /* ===== dock-charts — "Quiet Recorder" (reuses the dock's own CSS vars) ===== */
  #dock-charts { border-top: 1px solid var(--line); padding: 2px 0 4px; }
  #dock-charts .dc-block { padding: 6px 12px 7px; }
  #dock-charts .dc-h {
    font-size: 10px; text-transform: uppercase; letter-spacing: .8px;
    color: var(--faint); display: flex; justify-content: space-between;
    align-items: baseline; margin-bottom: 4px;
  }
  #dock-charts .dc-n { color: var(--dim); }
  #dock-charts .mono {
    font-family: ui-monospace, SFMono-Regular, Menlo, "Cascadia Mono", Consolas,
      "Noto Sans Mono CJK SC", monospace;
    font-variant-numeric: tabular-nums; font-feature-settings: "tnum" 1;
  }
  #dock-charts .dc-cv { display: block; width: 100%; height: 40px; image-rendering: crisp-edges; }
  #dock-charts .dc-cv-sm { height: 24px; }
  @media (prefers-reduced-motion: reduce) { #dock-charts .dc-cv { image-rendering: auto; } }
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="orb" id="orb"></div>
    <div class="who">
      <div class="name">Claude <span class="node" id="self">·</span></div>
      <div class="reason" id="reason">连接中…</div>
      <div class="cortex" id="cortex"></div>
    </div>
    <div class="mode-badge" id="mode">—</div>
  </header>
  <main id="main"></main>
  <footer id="footer"></footer>
</div>

<script>
const MOOD = {
  happy:'#2ea043', calm:'#39c5cf', content:'#39c5cf',
  thinking:'#4493f8', orienting:'#4493f8', working:'#4493f8', focused:'#4493f8',
  alert:'#d29922', concerned:'#d29922', tired:'#8b949e', idle:'#6e7681',
  error:'#f85149', sad:'#f85149',
};
const esc = s => (s==null?'':String(s)).replace(/[&<>"]/g, c =>
  ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function ago(sec){
  if (sec==null || sec<0) return '—';
  if (sec<60) return sec+'s';
  if (sec<3600) return Math.floor(sec/60)+'m';
  if (sec<86400) return Math.floor(sec/3600)+'h';
  return Math.floor(sec/86400)+'d';
}
function sectionEmpty(t){ return `<div class="empty">${t}</div>`; }

function render(d){
  // face
  const mood = (d.face && d.face.mood) || 'idle';
  document.documentElement.style.setProperty('--mood', MOOD[mood] || MOOD.idle);
  document.getElementById('self').textContent = '· ' + (d.node_self || '?');
  document.getElementById('reason').textContent =
    (d.face && (d.face.reason || d.face.last_event)) || '静默';
  document.getElementById('mode').textContent = (d.face && (d.face.mode || d.face.mood)) || '—';

  // cortex motion → orb expression (breath speed / amplitude / glow) + gesture line
  const cx = (d.face && d.face.cortex) || {};
  const INTENS = { low:['4.8s','1.06','10px'], medium:['3.4s','1.11','16px'],
                   med:['3.4s','1.11','16px'], high:['2.1s','1.18','22px'] };
  const [bdur,bamp,glow] = INTENS[cx.intensity] || ['3.6s','1.12','14px'];
  const rs = document.documentElement.style;
  rs.setProperty('--breath-dur', bdur);
  rs.setProperty('--breath-amp', bamp);
  rs.setProperty('--glow', glow);
  document.getElementById('cortex').textContent =
    [cx.gesture, cx.attention].filter(Boolean).join(' · ').replace(/_/g,' ');

  let h = '';

  // approvals (only when present) — clickable; the click RECORDS the decision
  // (the gated desktop_confirm still executes; the dock never runs host actions)
  if (d.approvals && d.approvals.length){
    h += `<section><div class="sec-h">待你拍板 · approvals</div>`;
    for (const a of d.approvals){
      const sum = esc(a.summary || a.kind || a.token || '');
      const kind = esc(a.kind || 'host action');
      if (a.decided){
        const yes = a.decided === 'approve';
        h += `<div class="approval decided"><span class="k ${yes?'yes':'no'}">${yes?'✓ 已批准':'✗ 已拒绝'}</span>
              <span class="ap-sum"> · ${sum} · 待执行</span></div>`;
      } else {
        h += `<div class="approval"><div class="ap-row"><span class="k">⚠ ${kind}</span></div>
              <div class="ap-sum">${sum}</div>
              <div class="ap-btns">
                <button class="ap-yes" data-token="${esc(a.token)}">允许</button>
                <button class="ap-no" data-token="${esc(a.token)}">拒绝</button>
              </div></div>`;
      }
    }
    h += `</section>`;
  }

  // presence
  h += `<section><div class="sec-h"><span>在场 · presence</span>
        <span>${(d.presence||[]).filter(p=>p.fresh).length} live</span></div>`;
  if (!d.presence || !d.presence.length) h += sectionEmpty('无在场记录');
  else for (const p of d.presence.slice(0,5)){
    h += `<div class="row"><span class="dot ${p.fresh?'live':''}"></span>
          <span class="grow">${esc(p.node)}<span class="muted">:${esc(p.project)}:${esc(p.role)}</span></span>
          <span class="age">${ago(p.age_s)}</span></div>`;
  }
  h += `</section>`;

  // notifications
  h += `<section><div class="sec-h">通知 · notifications</div>`;
  if (!d.notifications || !d.notifications.length) h += sectionEmpty('暂无通知');
  else for (const n of d.notifications.slice(0,4)){
    h += `<div class="row"><span class="sev ${esc(n.severity)}"></span>
          <span class="grow"><span class="ntitle">${esc(n.title)}</span></span>
          <span class="age">${ago(n.age_s)}</span></div>`;
  }
  h += `</section>`;

  // sessions
  const act = (d.sessions||[]).filter(s=>s.active);
  h += `<section><div class="sec-h"><span>会话 · sessions</span>
        <span>${act.length} active</span></div>`;
  if (!d.sessions || !d.sessions.length) h += sectionEmpty('无会话记录');
  else for (const s of d.sessions.slice(0,4)){
    const tag = s.active ? `<span class="pill ok">running</span>`
      : (s.exit_code===0 ? `<span class="muted">ok</span>`
         : `<span class="pill bad">exit ${esc(s.exit_code)}</span>`);
    h += `<div class="row"><span class="dot ${s.active?'live':''}"></span>
          <span class="grow">${esc(s.runtime_id)}<span class="muted"> · ${esc((s.cwd||'').split('/').pop())}</span></span>
          ${tag} <span class="age">${ago(s.age_s)}</span></div>`;
  }
  h += `</section>`;

  document.getElementById('main').innerHTML = h;

  // footer: sync + daemon heartbeat + freshness
  const sync = d.sync || {};
  const fails = sync.consecutive_failures;
  const syncTxt = (fails==null) ? 'sync —'
    : (fails>0 ? `<span class="pill bad">sync ✗${fails}</span>` : `<span class="pill ok">sync ok</span>`);
  const dm = d.daemon || {};
  const dmTxt = dm.fresh ? `<span class="pill ok">♥ ${ago(dm.age_s)}</span>`
    : `<span class="muted">♥ ${ago(dm.age_s)}</span>`;
  document.getElementById('footer').innerHTML =
    `<span class="hb">daemon ${dmTxt}</span>
     <span class="hb">${syncTxt}</span>
     <span class="hb" style="margin-left:auto">更新于 <b id="upd"></b></span>`;
  document.getElementById('upd').textContent =
    ago(Math.floor(Date.now()/1000) - (d.generated_at||0)) + '前';

  // dynamic charts ("Quiet Recorder") — keep a short rolling history and draw
  window.__dockHist = (window.__dockHist || []);
  window.__dockHist.push(d);
  if (window.__dockHist.length > 60) window.__dockHist.shift();
  if (window.DOCKCHARTS) window.DOCKCHARTS.renderCharts(d, window.__dockHist);
}

async function tick(){
  try {
    const r = await fetch('dock_snapshot.json?_=' + Date.now(), {cache:'no-store'});
    render(await r.json());
  } catch(e) {
    document.getElementById('reason').textContent = '聚合器未连接 (' + e + ')';
  }
}

// approval buttons are rebuilt every render → delegate clicks on #main.
// A click only RECORDS the decision (POST /api/decide); the gated executor
// still consumes the single-use token and performs the action.
document.getElementById('main').addEventListener('click', async (e) => {
  const btn = e.target.closest('.ap-yes, .ap-no');
  if (!btn) return;
  const token = btn.getAttribute('data-token');
  const decision = btn.classList.contains('ap-yes') ? 'approve' : 'reject';
  btn.disabled = true;
  try {
    const r = await fetch('/api/decide', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ token, decision }),
    });
    const j = await r.json();
    if (j && j.ok) tick(); else btn.disabled = false;
  } catch (err) { btn.disabled = false; }
});

tick();
setInterval(tick, 3000);
</script>

<script>
/* ================================================================
   DOCK CHARTS — "Quiet Recorder"
   Two calm canvas charts for the presence dock, every pixel driven by
   real dock_snapshot.json fields. One shared ~30fps rAF loop, reads the
   dock's live CSS vars (incl. --mood) each frame so it breathes with the
   header orb. Vanilla JS, no deps, self-builds its DOM.
   ================================================================ */
(function () {
  const NS = (window.DOCKCHARTS = window.DOCKCHARTS || {});
  const DPR = Math.max(1, Math.min(2, window.devicePixelRatio || 1));

  function cssv(n, fb) {
    const v = getComputedStyle(document.documentElement).getPropertyValue(n).trim();
    return v || fb;
  }
  const C = () => ({
    bg: cssv('--bg', '#0e1116'), panel: cssv('--panel', '#161b22'),
    line: cssv('--line', '#232a33'), fg: cssv('--fg', '#e6edf3'),
    dim: cssv('--dim', '#8b949e'), faint: cssv('--faint', '#6e7681'),
    ok: cssv('--ok', '#2ea043'), info: cssv('--info', '#4493f8'),
    warn: cssv('--warn', '#d29922'), bad: cssv('--bad', '#f85149'),
    idle: cssv('--idle', '#6e7681'), mood: cssv('--mood', '#4493f8'),
  });

  const now = () => Date.now() / 1000,
    clamp = (x, a, b) => (x < a ? a : x > b ? b : x),
    lerp = (a, b, t) => a + (b - a) * t,
    ease = t => 1 - Math.pow(1 - clamp(t, 0, 1), 3);

  // honest recency: log-scaled so 1 fresh node + 11 days-old nodes spread
  // out instead of being crushed to a flat floor (vs naive 1-age/86400).
  function recencyH(age_s) {
    const a = Math.max(0, age_s == null ? 1e9 : age_s);
    return clamp(1 - Math.log10(1 + a / 60) / Math.log10(1 + 4320), 0, 1);
  }
  function exitColor(c, s) {
    if (s.active) return c.info;             // running -> info blue
    if (s.exit_code == null) return c.idle;  // unknown
    if (s.exit_code === 0) return c.ok;       // clean
    if (s.exit_code === -15 || s.exit_code === 143) return c.warn; // SIGTERM tidy-stop
    return c.bad;                             // crash
  }
  function sevColor(c, s) {
    s = (s || '').toLowerCase();
    return s === 'success' ? c.ok : s === 'info' ? c.info
      : (s === 'warn' || s === 'warning') ? c.warn
      : (s === 'error' || s === 'critical') ? c.bad : c.idle;
  }
  function spanLabel(sec) {
    return sec < 3600 ? Math.round(sec / 60) + 'm'
      : sec < 86400 ? Math.round(sec / 3600) + 'h'
      : (sec / 86400).toFixed(1) + 'd';
  }
  const MONO = '10px ui-monospace,Menlo,Consolas,monospace';

  function fitCanvas(cv, W, H) {
    const w = Math.round(W * DPR), h = Math.round(H * DPR);
    if (cv.width !== w || cv.height !== h) { cv.width = w; cv.height = h; }
    cv.style.width = W + 'px'; cv.style.height = H + 'px';
    const g = cv.getContext('2d'); g.setTransform(DPR, 0, 0, DPR, 0, 0);
    g.clearRect(0, 0, W, H); return g;
  }
  function emptyText(g, H, c, msg) {
    g.fillStyle = c.faint; g.font = MONO; g.textBaseline = 'middle';
    g.fillText(msg, 2, H / 2);
  }

  // ---- build / locate DOM (idempotent) ----
  function ensureDom() {
    let root = document.getElementById('dock-charts');
    if (!root) {
      root = document.createElement('section'); root.id = 'dock-charts';
      const main = document.getElementById('main');
      const foot = document.getElementById('footer');
      (main && main.parentNode || document.body).insertBefore(root, foot || null);
    }
    if (root.dataset.built) return root;
    root.dataset.built = '1';
    root.innerHTML =
      '<div class="dc-block"><div class="dc-h"><span>活动时间线 · timeline</span>' +
        '<span class="dc-n mono" id="dc-tl-n">·</span></div>' +
        '<canvas class="dc-cv" id="dc-tl-cv"></canvas></div>' +
      '<div class="dc-block"><div class="dc-h"><span>在场 recency · presence</span>' +
        '<span class="dc-n mono" id="dc-pres-n">·</span></div>' +
        '<canvas class="dc-cv dc-cv-sm" id="dc-pres-cv"></canvas></div>';
    return root;
  }

  NS.m = NS.m || { presence: { prev: [], next: [], t0: 0, dur: 0.6 } };

  /* ============ CHART 1 — Activity timeline ============ */
  function drawTimeline(g, W, H, c, snap) {
    const sessions = (snap.sessions || []).slice(0, 8);
    const notifs = (snap.notifications || []).filter(n => n.ts);
    if (!sessions.length && !notifs.length) { emptyText(g, H, c, '无活动记录'); return; }

    const tNow = now();
    let t0 = Infinity, t1 = tNow;
    for (const s of sessions) {
      if (s.started_at) { t0 = Math.min(t0, s.started_at); t1 = Math.max(t1, s.active ? tNow : (s.ended_at || s.started_at)); }
    }
    if (!isFinite(t0)) {
      for (const n of notifs) t0 = Math.min(t0, n.ts);
      if (!isFinite(t0)) t0 = tNow - 360;
    }
    const span = Math.max(360, t1 - t0);
    const padR = 6, trackW = W - 2 - padR;
    const X = ts => 1 + clamp((ts - t0) / span, 0, 1) * trackW;

    const railH = 6;
    const top = 2, usable = H - railH - top;
    const MINW = 3;
    const lanes = [];
    const placed = sessions.map(s => {
      const xs = X(s.started_at || t0);
      const xe = Math.max(xs + MINW, X(s.active ? tNow : (s.ended_at || s.started_at || t0)));
      let L = 0; for (; L < lanes.length; L++) if (lanes[L] <= xs - 1) break;
      lanes[L] = xe; return { s, xs, xe, L };
    });
    const lc = Math.max(1, lanes.length);
    const lh = Math.min(7, usable / lc);
    for (const p of placed) {
      const y = top + p.L * lh, bh = Math.max(3, lh - 2);
      g.globalAlpha = p.s.active ? 1 : 0.82;
      g.fillStyle = exitColor(c, p.s);
      g.fillRect(p.xs, y, p.xe - p.xs, bh);
      g.fillRect(p.xs, y - 1, 1, bh + 2);
      if (p.s.active) {
        const pulse = 0.5 + 0.5 * Math.sin(tNow * 3);
        g.globalAlpha = 0.4 + 0.6 * pulse; g.fillStyle = c.info;
        g.fillRect(p.xe - 1.5, y - 1, 1.5, bh + 2);
      }
    }
    g.globalAlpha = 1;

    const railY = H - 1.5;
    for (const n of notifs) {
      const x = Math.round(X(n.ts)) + 0.5;
      const sev = (n.severity || '').toLowerCase();
      const wgt = sev === 'error' || sev === 'critical' ? 1
        : sev === 'warn' || sev === 'warning' ? 0.8
        : sev === 'info' ? 0.6 : 0.55;
      const hh = railH * wgt;
      const fresh = (tNow - n.ts) < 8;
      g.globalAlpha = fresh ? clamp((tNow - n.ts) / 8 * 0.6 + 0.4, 0.4, 1) : 1;
      g.strokeStyle = sevColor(c, n.severity); g.lineWidth = 1;
      g.beginPath(); g.moveTo(x, railY); g.lineTo(x, railY - hh); g.stroke();
    }
    g.globalAlpha = 1; g.strokeStyle = c.line; g.lineWidth = 1;
    g.beginPath(); g.moveTo(W - padR + 0.5, top); g.lineTo(W - padR + 0.5, H); g.stroke();

    const el = document.getElementById('dc-tl-n');
    if (el) el.textContent = sessions.filter(s => s.active).length + ' active · ' + spanLabel(span);
  }

  /* ============ CHART 2 — Presence recency sparkbars ============ */
  function ingestPresence(snap) {
    const m = NS.m.presence, list = (snap.presence || []).slice(0, 16);
    const next = list.map(p => ({ h: recencyH(p.age_s), fresh: !!p.fresh }));
    m.prev = (m.next.length === next.length) ? m.next : next.map(x => ({ ...x, h: 0 }));
    m.next = next; m.t0 = now();
    const el = document.getElementById('dc-pres-n');
    if (el) el.textContent = list.filter(p => p.fresh).length + '/' + list.length + ' live';
  }
  function drawPresence(g, W, H, c) {
    const m = NS.m.presence, e = ease((now() - m.t0) / m.dur);
    const rows = m.next, n = rows.length;
    if (!n) { emptyText(g, H, c, '无在场记录'); return; }
    const slot = (W - 1) / n, bw = Math.max(1.5, Math.min(7, slot - 2)), baseY = H - 1.5;
    for (let i = 0; i < n; i++) {
      const r = rows[i], pr = m.prev[i];
      const hv = lerp(pr ? pr.h : 0, r.h, e);
      const cx = 1 + i * slot + slot / 2;
      const topY = baseY - Math.max(1, hv * (H - 3));
      g.globalAlpha = r.fresh ? 1 : 0.7;
      g.fillStyle = r.fresh ? c.ok : c.faint;
      g.fillRect(cx - bw / 2, topY, bw, baseY - topY);
      if (r.fresh) {
        g.globalAlpha = 1; g.fillStyle = c.ok;
        g.fillRect(cx - 0.75, topY - 2, 1.5, 1.5);
      }
    }
    g.globalAlpha = 1; g.strokeStyle = c.line; g.lineWidth = 1;
    g.beginPath(); g.moveTo(0, baseY + 0.5); g.lineTo(W, baseY + 0.5); g.stroke();
  }

  // ---- paint + shared rAF loop ----
  function paint(id, H, fn) {
    const cv = document.getElementById(id); if (!cv) return;
    const W = cv.clientWidth || (cv.parentElement && cv.parentElement.clientWidth) || 336;
    fn(fitCanvas(cv, W, H), W, H);
  }
  NS.frame = function (ts) {
    NS.raf = requestAnimationFrame(NS.frame);
    if (NS._last && ts - NS._last < 33) return;   // ~30fps, calm + cheap
    NS._last = ts;
    if (document.hidden) return;
    const snap = NS.lastSnap; if (!snap) return;
    const c = C();
    paint('dc-tl-cv', 40, (g, W, H) => drawTimeline(g, W, H, c, snap));
    paint('dc-pres-cv', 24, (g, W, H) => drawPresence(g, W, H, c));
  };
  NS.renderCharts = function (snap, history) {
    if (!snap) return;
    NS.lastSnap = snap; NS.lastHistory = history;
    ensureDom(); ingestPresence(snap);
    if (!NS.raf) NS.raf = requestAnimationFrame(NS.frame);
  };
})();
</script>
