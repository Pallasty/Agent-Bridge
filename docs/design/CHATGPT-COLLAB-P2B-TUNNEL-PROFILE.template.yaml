config_version: 1
control_plane:
  base_url: "https://api.openai.com"
  tunnel_id: "tunnel_REPLACE_WITH_SEPARATE_TUNNEL_ID"
  api_key: "env:CONTROL_PLANE_API_KEY"
health:
  # Do not reuse the production chatgpt-read profile's 127.0.0.1:8080 port.
  listen_addr: "127.0.0.1:8081"
admin_ui:
  open_browser: false
log:
  level: info
  format: json
mcp:
  server_urls:
    - channel: main
      url: "http://127.0.0.1:18792/mcp"
