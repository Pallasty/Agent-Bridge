[package]
name = "ab-tts"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Pluggable, offline, Rust-native TTS backends (Kokoro / Piper via ort) for the output-expression audio-embodiment lane (present_voice). Each backend is feature-gated so the core workspace never carries the ONNX Runtime dependency unless TTS is enabled."

[dependencies]
# Always-on: lightweight error handling for the backend-agnostic surface.
thiserror = { workspace = true }

# Feature-gated heavy/native deps — pulled ONLY when a backend is enabled, so a
# default `cargo build` of the workspace never compiles the ONNX Runtime.
ort = { version = "=2.0.0-rc.12", optional = true }            # ONNX Runtime (inference)
ndarray = { version = "0.16", optional = true }                # tensor I/O for ort
# Kokoro g2p. default-features=false DROPS the optional `espeak` feature (which
# pulls espeak-rs-sys: a C/bindgen build + GPL-3.0) → misaki-rs stays pure-Rust,
# MIT, no C toolchain, GPL-free. Trade-off: out-of-vocabulary words use misaki's
# embedded lexicon + rules instead of an espeak fallback (acceptable for v0).
misaki-rs = { version = "0.3", optional = true, default-features = false }
serde_json = { version = "1", optional = true }                # parse piper_phonemize JSONL + voice .onnx.json
hound = { version = "3", optional = true }                     # WAV encode for falsifier capture

[features]
default = []
# Kokoro-82M (StyleTTS2, Apache-2.0, 24kHz): misaki-rs g2p + ort ONNX.
kokoro = ["dep:ort", "dep:ndarray", "dep:misaki-rs", "dep:hound"]
# Piper (VITS, MIT model / GPL-3.0 espeak-ng phonemes, 22.05kHz): phonemes via the
# bundled `piper_phonemize` CLI (shelled to like whisper-cli/ffmpeg, so the crate
# links no GPL C code and needs no bindgen) + the VITS `.onnx` forward via ort.
piper = ["dep:ort", "dep:ndarray", "dep:serde_json", "dep:hound"]
all-backends = ["kokoro", "piper"]

# Production synthesis CLI (text → WAV), invoked by scripts/audio_embody.py in
# speech mode. Gated on `kokoro` so the heavy `ort` link only happens when the
# TTS backend is actually built — the agent-bridge binary never carries it.
[[bin]]
name = "ab-tts-synth"
path = "src/bin/ab_tts_synth.rs"
required-features = ["kokoro"]

# Dogfood examples are each gated on their backend feature so a single-backend
# build (e.g. `--features piper`) never tries to compile the other backend's example.
[[example]]
name = "kokoro_synth"
required-features = ["kokoro"]

[[example]]
name = "piper_synth"
required-features = ["piper"]
