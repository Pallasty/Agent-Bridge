[package]
name = "ab-agent"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
ab-core.workspace = true
ab-store.workspace = true
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
uuid.workspace = true
dashmap.workspace = true
thiserror.workspace = true
sha2 = "0.10"
tempfile = "3"

# Interactive PTY-backed agent sessions (live `send_input`). Same version as
# the in-daemon PtyBackend in `ab-terminal` so they share one build of the dep.
portable-pty = "0.9"

# SIGKILL escalation for interactive children that catch and survive the
# graceful SIGHUP portable-pty's ChildKiller sends (e.g. gemini's Ink TUI).
[target.'cfg(unix)'.dependencies]
libc = "0.2"
# Keep this exact pin: the macOS Seatbelt profile is order-sensitive, and the
# workspace-deny contract must be re-audited with its e2e test before upgrades.
nono = { version = "=0.53.0", default-features = false }
