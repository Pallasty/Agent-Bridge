[package]
name = "ab-store"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = ["onnx-embed"]
onnx-embed = ["dep:fastembed"]
temporal-evidence-s4-synthetic = []
temporal-evidence-s5-candidate-synthetic = ["temporal-evidence-s4-synthetic", "dep:ring"]
temporal-evidence-s6-detached-verifier-synthetic = ["temporal-evidence-s5-candidate-synthetic"]
temporal-evidence-s7-durable-replay-synthetic = ["temporal-evidence-s6-detached-verifier-synthetic"]

[dependencies]
ab-core.workspace = true
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2 = "0.10"
ring = { version = "0.17", optional = true }
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
tokio-rusqlite.workspace = true
walkdir.workspace = true
# Optional: real sentence-transformer embedding via ONNX (all-MiniLM-L6-v2, 384-dim).
# Activated by default; disable with --no-default-features for hash-only builds.
fastembed = { version = "5", optional = true, default-features = false, features = ["hf-hub", "ort-download-binaries"] }

[[bin]]
name = "backfill-embeddings"
path = "src/bin/backfill_embeddings.rs"
