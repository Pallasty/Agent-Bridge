[package]
name = "ab-store"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = ["onnx-embed"]
onnx-embed = ["dep:fastembed"]
temporal-evidence-s4-synthetic = []
temporal-evidence-s5-candidate-synthetic = ["temporal-evidence-s4-synthetic", "dep:ring"]
temporal-evidence-s6-detached-verifier-synthetic = ["temporal-evidence-s5-candidate-synthetic"]
temporal-evidence-s7-durable-replay-synthetic = ["temporal-evidence-s6-detached-verifier-synthetic"]
temporal-evidence-s8-restore-bound-key-epoch-synthetic = ["temporal-evidence-s7-durable-replay-synthetic"]
temporal-evidence-s9-external-authority-provider-synthetic = ["temporal-evidence-s8-restore-bound-key-epoch-synthetic"]
temporal-evidence-s10-operation-recovery-synthetic = ["temporal-evidence-s9-external-authority-provider-synthetic"]
temporal-evidence-s11-atomic-authority-operation-synthetic = ["temporal-evidence-s10-operation-recovery-synthetic"]
temporal-evidence-s12-recovered-s9-decision-reverification-synthetic = ["temporal-evidence-s11-atomic-authority-operation-synthetic"]
temporal-evidence-s13-recovered-envelope-delivery-synthetic = ["temporal-evidence-s12-recovered-s9-decision-reverification-synthetic"]
temporal-evidence-s14-recovered-envelope-source-synthetic = ["temporal-evidence-s13-recovered-envelope-delivery-synthetic"]
temporal-evidence-s15-recovered-envelope-bounded-runtime-adapter-synthetic = ["temporal-evidence-s14-recovered-envelope-source-synthetic"]
temporal-evidence-s16-recovered-envelope-durability-fault-model-synthetic = ["temporal-evidence-s15-recovered-envelope-bounded-runtime-adapter-synthetic"]
temporal-evidence-s18-owned-lab-authorization-verifier-synthetic = ["temporal-evidence-s16-recovered-envelope-durability-fault-model-synthetic"]
temporal-evidence-s19-owned-lab-source-bound-runner-synthetic = ["temporal-evidence-s18-owned-lab-authorization-verifier-synthetic"]
engram-g1-authenticated-envelope-shadow-synthetic = ["dep:ring"]
temporal-evidence-s20-owned-lab-trusted-controller-orchestration-synthetic = ["temporal-evidence-s19-owned-lab-source-bound-runner-synthetic"]
engram-g1-secure-custody-shadow-synthetic = ["dep:libc"]
temporal-evidence-s20b-owned-lab-rich-packet-validators-synthetic = ["temporal-evidence-s20-owned-lab-trusted-controller-orchestration-synthetic"]

[dependencies]
ab-core.workspace = true
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2 = "0.10"
ring = { version = "0.17", optional = true }
libc = { version = "0.2", optional = true }
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
tokio-rusqlite.workspace = true
walkdir.workspace = true
# Optional: real sentence-transformer embedding via ONNX (all-MiniLM-L6-v2, 384-dim).
# Activated by default; disable with --no-default-features for hash-only builds.
fastembed = { version = "5", optional = true, default-features = false, features = ["hf-hub", "ort-download-binaries"] }

[[bin]]
name = "backfill-embeddings"
path = "src/bin/backfill_embeddings.rs"

[dev-dependencies]
tempfile = "3"
