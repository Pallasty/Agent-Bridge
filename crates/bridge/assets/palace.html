<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Palace · agent-bridge memory viewer</title>
  <script src="https://unpkg.com/cytoscape@3.28.1/dist/cytoscape.min.js"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 0;
      background: #0a0a0f;
      color: #e4e4e8;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      overflow: hidden;
      height: 100vh;
      display: flex;
    }
    #cy {
      flex: 1;
      min-width: 0;       /* allow flex shrink below cytoscape's internal canvas size */
      height: 100vh;
      background: radial-gradient(ellipse at center, #0e0e16 0%, #06060b 75%);
      transition: transform 320ms ease, filter 320ms ease;
      transform-origin: center center;
    }
    /* B-mode visual rebalance: when canvas is open, the Palace recedes
       (vision principle "Palace 微缩 0.95→1.0 替代瞬切"). Subtle scale
       + filter so it reads as "background context" without disappearing. */
    body.canvas-open #cy { transform: scale(0.97); filter: brightness(0.78); }
    /* ── Top bar ──────────────────────────────────────────── */
    #topbar {
      position: absolute;
      top: 14px;
      left: 22px;
      right: 22px;
      display: flex;
      align-items: center;
      gap: 14px;
      z-index: 20;
      pointer-events: none;
    }
    #topbar > * { pointer-events: auto; }
    #title {
      color: #5a5a68;
      font-size: 10px;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      font-weight: 500;
      flex-shrink: 0;
    }
    #title .count { color: #8a8a9c; }
    #search {
      flex: 1;
      max-width: 360px;
      background: rgba(20, 20, 28, 0.85);
      border: 1px solid #2a2a35;
      color: #e4e4e8;
      padding: 7px 12px;
      font-size: 12px;
      border-radius: 4px;
      outline: none;
      font-family: inherit;
      backdrop-filter: blur(6px);
    }
    #search:focus { border-color: #4a4a60; }
    #search::placeholder { color: #5a5a68; }
    #filter-btn {
      background: rgba(20, 20, 28, 0.85);
      border: 1px solid #2a2a35;
      color: #9a9aa8;
      padding: 7px 12px;
      font-size: 11px;
      border-radius: 4px;
      cursor: pointer;
      letter-spacing: 0.05em;
      backdrop-filter: blur(6px);
      transition: color 120ms;
    }
    #filter-btn:hover { color: #e4e4e8; border-color: #4a4a60; }
    #filter-btn.active { color: #e4e4e8; border-color: #5a5a72; background: #1c1c26; }
    /* ── Filter panel ─────────────────────────────────────── */
    #filter-panel {
      position: absolute;
      top: 56px;
      right: 22px;
      width: 240px;
      background: rgba(19, 19, 25, 0.96);
      border: 1px solid #2a2a35;
      border-radius: 6px;
      padding: 14px 16px;
      z-index: 25;
      backdrop-filter: blur(10px);
      max-height: calc(100vh - 100px);
      overflow-y: auto;
    }
    #filter-panel.hidden { display: none; }
    #filter-panel h3 {
      margin: 0 0 6px 0;
      font-size: 10px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: #6a6a78;
      font-weight: 600;
    }
    #filter-panel .section + .section { margin-top: 14px; padding-top: 14px; border-top: 1px solid #1f1f2a; }
    #filter-panel label {
      display: flex;
      align-items: center;
      padding: 3px 0;
      font-size: 12px;
      cursor: pointer;
      color: #b8b8c2;
      gap: 6px;
    }
    #filter-panel label:hover { color: #e4e4e8; }
    #filter-panel input[type="checkbox"] {
      accent-color: #6a8eff;
      width: 13px;
      height: 13px;
      flex-shrink: 0;
    }
    #filter-panel .swatch {
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    #filter-panel .count {
      margin-left: auto;
      color: #5a5a68;
      font-size: 10px;
      font-variant-numeric: tabular-nums;
    }
    #filter-panel .actions {
      display: flex;
      gap: 8px;
      margin-top: 4px;
    }
    #filter-panel .actions button {
      background: transparent;
      border: 1px solid #2a2a35;
      color: #8a8a9c;
      padding: 3px 8px;
      font-size: 10px;
      border-radius: 3px;
      cursor: pointer;
      letter-spacing: 0.05em;
    }
    #filter-panel .actions button:hover { color: #e4e4e8; border-color: #4a4a60; }
    /* ── Sidebar ──────────────────────────────────────────── */
    #panel {
      flex: 0 0 380px;
      background: #131319;
      border-left: 1px solid #2a2a35;
      padding: 20px 22px;
      overflow-y: auto;
      max-height: 100vh;
    }
    #panel.hidden { display: none; }
    #panel h2 {
      margin: 0 0 6px 0;
      font-size: 14px;
      font-weight: 600;
      color: #f0f0f4;
      word-break: break-word;
      line-height: 1.4;
    }
    #panel .meta {
      color: #6a6a78;
      font-size: 10px;
      margin-bottom: 6px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
    #panel .meta-time {
      color: #4a4a55;
      font-size: 10px;
      margin-bottom: 14px;
      letter-spacing: 0.04em;
      font-variant-numeric: tabular-nums;
    }
    #panel .desc {
      color: #d8d8e2;
      font-size: 12px;
      line-height: 1.55;
      font-style: italic;
      margin: 4px 0 12px 0;
      padding: 8px 10px;
      background: #1a1a24;
      border-left: 2px solid #4a4a5a;
      border-radius: 2px;
    }
    #panel .tags { margin: 6px 0 16px 0; }
    #panel .tag {
      display: inline-block;
      padding: 2px 8px;
      margin: 2px 4px 2px 0;
      background: #1c1c26;
      color: #9a9aa8;
      border-radius: 10px;
      font-size: 10px;
      letter-spacing: 0.02em;
    }
    #panel .content {
      white-space: pre-wrap;
      font-size: 12px;
      line-height: 1.6;
      color: #b8b8c2;
      font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
      border-top: 1px solid #1f1f2a;
      padding-top: 14px;
    }
    #panel .placeholder {
      color: #4a4a55;
      font-size: 11px;
      font-style: italic;
      margin-top: 50%;
      text-align: center;
      letter-spacing: 0.05em;
    }
    #panel .annotate-section {
      margin-top: 18px;
      padding-top: 14px;
      border-top: 1px solid #1f1f2a;
    }
    #panel .reports-section {
      margin-top: 16px;
      padding-top: 12px;
      border-top: 1px solid #1f1f2a;
    }
    #panel .reports-title {
      font-size: 10px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: #6a6a78;
      margin-bottom: 6px;
    }
    #panel .reports-list { display: flex; flex-direction: column; gap: 4px; }
    #panel .reports-list a {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 5px 9px;
      border: 1px solid #2a2a38;
      border-left: 2px solid #5cc8c8;
      border-radius: 3px;
      color: #c0c0cc;
      text-decoration: none;
      font-size: 11px;
      font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
      transition: border-color 120ms, color 120ms;
    }
    #panel .reports-list a:hover { color: #5cc8c8; border-color: #5cc8c8; }
    #panel .reports-list .report-meta { color: #6a6a78; margin-left: auto; font-size: 10px; }
    #panel .canvas-expand-btn {
      background: transparent;
      border: 1px solid #4a8b9c;
      color: #5cc8c8;
      padding: 7px 12px;
      font-size: 11px;
      border-radius: 4px;
      cursor: pointer;
      letter-spacing: 0.05em;
      width: 100%;
      margin-top: 6px;
      transition: color 120ms, border-color 120ms, background 120ms;
      font-family: inherit;
    }
    #panel .canvas-expand-btn:hover {
      color: #aef0f0;
      border-color: #5cc8c8;
      background: #16242a;
    }

    /* ── B M0 canvas overlay (interaction blueprint layer) ────────
       width is driven by `--canvas-width` so M1 can narrow to e.g.
       60vw without rewriting layout (Palace stays visible behind). */
    :root {
      --canvas-width: 100vw;
      --canvas-fade: 320ms;
    }
    /* B M1 — narrow mode: canvas takes 60vw on the right, Palace stays
       visible behind the remaining 40vw. The toggle button in the focus
       bar flips this class on <body>. Transition shares the canvas-fade
       timing so the slide is one motion. */
    body.canvas-narrow { --canvas-width: 60vw; }
    /* In narrow mode Palace stays brighter — the user is co-piloting
       with the graph still in view. */
    body.canvas-narrow.canvas-open #cy { transform: scale(0.99); filter: brightness(0.92); }
    .canvas-narrow-toggle {
      background: transparent;
      border: 1px solid #2a2a35;
      color: #6a6a78;
      padding: 5px 10px;
      font-size: 11px;
      border-radius: 4px;
      cursor: pointer;
      letter-spacing: 0.05em;
      font-family: inherit;
      margin-left: auto;
      transition: color 120ms, border-color 120ms;
    }
    .canvas-narrow-toggle:hover { color: #5cc8c8; border-color: #4a8b9c; }
    body.canvas-narrow .canvas-narrow-toggle { color: #5cc8c8; border-color: #5cc8c8; }
    #canvas-overlay {
      position: fixed;
      top: 0;
      right: 0;
      width: var(--canvas-width);
      height: 100vh;
      background: linear-gradient(180deg, #0d0d14 0%, #0a0a10 100%);
      z-index: 80;
      display: flex;
      flex-direction: column;
      transform: translateY(0);
      opacity: 1;
      transition: opacity var(--canvas-fade) ease,
                  transform var(--canvas-fade) ease;
    }
    #canvas-overlay.hidden { display: none; }
    #canvas-overlay.entering { opacity: 0; transform: translateY(8px); }
    #canvas-overlay.leaving  { opacity: 0; transform: translateY(8px); pointer-events: none; }
    #canvas-overlay.freezing { /* "fade-to-ice" on save: dim editor, freeze rail */
      opacity: 0.75;
      filter: saturate(0.55) brightness(0.85);
      pointer-events: none;
    }

    .canvas-focus {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 14px 24px;
      border-bottom: 1px solid #1f1f2a;
      flex-shrink: 0;
      background: rgba(15, 15, 22, 0.85);
    }
    .canvas-close {
      background: transparent;
      border: 1px solid #2a2a35;
      color: #8a8a9c;
      padding: 5px 12px;
      font-size: 11px;
      border-radius: 4px;
      cursor: pointer;
      letter-spacing: 0.05em;
      font-family: inherit;
      transition: color 120ms, border-color 120ms;
    }
    .canvas-close:hover { color: #e4e4e8; border-color: #5a5a72; }
    .canvas-focus-card { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
    .canvas-focus-key {
      font-size: 13px;
      font-weight: 600;
      color: #f0f0f4;
      font-family: ui-monospace, "SF Mono", Menlo, monospace;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .canvas-focus-meta {
      font-size: 10px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #6a6a78;
    }

    .canvas-body {
      flex: 1;
      display: grid;
      grid-template-columns: 1fr 1fr 260px;
      gap: 1px;
      background: #1f1f2a;
      overflow: hidden;
    }
    .canvas-pane {
      background: #0e0e16;
      display: flex;
      flex-direction: column;
      min-width: 0;
    }
    .canvas-pane-label {
      padding: 8px 18px;
      font-size: 9px;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: #5a5a68;
      font-weight: 600;
      border-bottom: 1px solid #1f1f2a;
      background: #0a0a12;
    }
    #canvas-editor {
      flex: 1;
      width: 100%;
      background: #0a0a10;
      border: none;
      color: #d8d8e2;
      padding: 18px 22px;
      font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
      font-size: 13px;
      line-height: 1.65;
      resize: none;
      outline: none;
    }
    #canvas-editor::placeholder { color: #4a4a55; font-style: italic; }
    .canvas-preview {
      flex: 1;
      padding: 18px 24px;
      overflow-y: auto;
      color: #d0d0d8;
      font-size: 13px;
      line-height: 1.65;
    }
    .canvas-preview h1 { font-size: 18px; margin: 4px 0 12px; color: #f0f0f4; }
    .canvas-preview h2 { font-size: 15px; margin: 16px 0 8px; color: #e8e8ec; }
    .canvas-preview h3 { font-size: 13px; margin: 12px 0 6px; color: #d8d8e2;
                          letter-spacing: 0.04em; text-transform: uppercase; }
    .canvas-preview p { margin: 0 0 10px; }
    .canvas-preview ul, .canvas-preview ol { padding-left: 22px; margin: 4px 0 12px; }
    .canvas-preview li { margin: 2px 0; }
    .canvas-preview code {
      background: #1c1c26;
      padding: 1px 5px;
      border-radius: 2px;
      font-size: 12px;
      color: #aef0f0;
      font-family: ui-monospace, "SF Mono", Menlo, monospace;
    }
    .canvas-preview pre {
      background: #1a1a24;
      padding: 10px 14px;
      border-radius: 4px;
      border-left: 2px solid #3a3a48;
      overflow-x: auto;
      margin: 8px 0 14px;
    }
    .canvas-preview pre code { background: transparent; padding: 0; color: #c8c8d0; }
    .canvas-preview a { color: #5cc8c8; text-decoration: none; border-bottom: 1px dotted #4a8b9c; }
    .canvas-preview a:hover { color: #aef0f0; border-bottom-color: #5cc8c8; }
    .canvas-preview strong { color: #f0f0f4; }
    .canvas-preview em { color: #d8d8e2; font-style: italic; }
    .canvas-preview blockquote {
      margin: 8px 0;
      padding: 4px 12px;
      border-left: 2px solid #4a4a5a;
      color: #a8a8b2;
      font-style: italic;
    }
    .canvas-preview .placeholder {
      color: #4a4a55;
      font-style: italic;
      font-size: 11px;
    }

    .canvas-rail {
      background: #0c0c14;
      padding: 14px 16px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .canvas-rail-section { display: flex; flex-direction: column; gap: 5px; }
    .canvas-rail-title {
      font-size: 9px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: #5a5a68;
      font-weight: 600;
    }
    .canvas-rail a {
      display: block;
      padding: 4px 8px;
      border: 1px solid #1f1f2a;
      border-radius: 3px;
      color: #b0b0bc;
      text-decoration: none;
      font-size: 10px;
      font-family: ui-monospace, "SF Mono", Menlo, monospace;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      transition: color 120ms, border-color 120ms;
    }
    .canvas-rail a:hover { color: #5cc8c8; border-color: #4a8b9c; }
    .canvas-rail-empty {
      color: #3a3a48;
      font-size: 10px;
      font-style: italic;
    }
    .canvas-rail-cofires a    { border-left: 2px solid #6dd4bd; }
    .canvas-rail-annotations a { border-left: 2px solid #ffe070; }
    .canvas-rail-reports a    { border-left: 2px solid #5cc8c8; }

    .canvas-foot {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 12px 24px;
      border-top: 1px solid #1f1f2a;
      flex-shrink: 0;
      background: rgba(10, 10, 16, 0.85);
    }
    .canvas-hint {
      flex: 1;
      color: #5a5a68;
      font-size: 10px;
      letter-spacing: 0.05em;
    }
    .canvas-hint.error { color: #c8505c; }
    .canvas-hint.ok    { color: #5cc88a; }
    #canvas-save {
      background: #16242a;
      border: 1px solid #5cc8c8;
      color: #aef0f0;
      padding: 7px 18px;
      font-size: 12px;
      border-radius: 4px;
      cursor: pointer;
      letter-spacing: 0.05em;
      font-family: inherit;
      transition: background 120ms, color 120ms;
    }
    #canvas-save:hover { background: #1e3037; color: #ffffff; }
    #canvas-save:disabled { background: #1c1c26; color: #4a4a55; border-color: #2a2a35; cursor: wait; }
    #panel .annotate-toggle {
      background: transparent;
      border: 1px dashed #3a3a48;
      color: #8a8a9c;
      padding: 6px 12px;
      font-size: 11px;
      border-radius: 4px;
      cursor: pointer;
      letter-spacing: 0.05em;
      width: 100%;
      transition: color 120ms, border-color 120ms;
      font-family: inherit;
    }
    #panel .annotate-toggle:hover { color: #e4e4e8; border-color: #5a5a72; }
    #panel .annotate-form { display: none; }
    #panel .annotate-form.open { display: block; }
    #panel .annotate-form textarea {
      width: 100%;
      min-height: 90px;
      background: #0c0c12;
      border: 1px solid #2a2a35;
      color: #e4e4e8;
      padding: 8px 10px;
      font-size: 12px;
      font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
      line-height: 1.55;
      border-radius: 4px;
      outline: none;
      resize: vertical;
    }
    #panel .annotate-form textarea:focus { border-color: #4a4a60; }
    #panel .annotate-form .row {
      display: flex;
      gap: 8px;
      margin-top: 8px;
      align-items: center;
    }
    #panel .annotate-form button {
      background: transparent;
      border: 1px solid #2a2a35;
      color: #b8b8c2;
      padding: 5px 12px;
      font-size: 11px;
      border-radius: 3px;
      cursor: pointer;
      letter-spacing: 0.05em;
      font-family: inherit;
    }
    #panel .annotate-form button.save { color: #ffe070; border-color: #5a4a30; }
    #panel .annotate-form button:hover:not(:disabled) { color: #fff; border-color: #5a5a72; }
    #panel .annotate-form button:disabled { opacity: 0.4; cursor: not-allowed; }
    #panel .annotate-form .hint {
      color: #4a4a55;
      font-size: 10px;
      flex: 1;
      letter-spacing: 0.04em;
    }
    #panel .annotate-form .hint.error { color: #e25c5c; }
    #panel .annotate-form .hint.ok { color: #5cc89a; }
    /* ── Footer ──────────────────────────────────────────── */
    #footer {
      position: absolute;
      bottom: 14px;
      left: 22px;
      right: 22px;
      color: #3a3a45;
      font-size: 10px;
      pointer-events: none;
      z-index: 10;
      letter-spacing: 0.05em;
      display: flex;
      gap: 16px;
    }
    #footer .hint { color: #4a4a55; }
  </style>
</head>
<body>
  <div id="topbar">
    <div id="title">Palace · <span class="count" id="stats">loading…</span></div>
    <input id="search" type="text" placeholder="search key / kind / tag …" autocomplete="off">
    <button id="filter-btn" type="button">filter</button>
  </div>
  <div id="filter-panel" class="hidden"></div>
  <div id="cy"></div>
  <div id="panel" class="hidden">
    <div class="placeholder">click a node to read</div>
  </div>

  <!-- B M0 canvas overlay (呼吸式画布 / interaction blueprint layer).
       Width is driven by `--canvas-width`; M0 = 100vw, M1 will narrow
       it to leave Palace partially visible (40vw uncovered). -->
  <div id="canvas-overlay" class="hidden">
    <div class="canvas-focus">
      <button class="canvas-close" type="button">← back to Palace</button>
      <div class="canvas-focus-card">
        <div class="canvas-focus-key" id="canvas-focus-key"></div>
        <div class="canvas-focus-meta" id="canvas-focus-meta"></div>
      </div>
      <button class="canvas-narrow-toggle" id="canvas-narrow-toggle" type="button"
              title="toggle narrow mode (Palace stays visible) — cmd/ctrl+\\">⊟ narrow</button>
    </div>
    <div class="canvas-body">
      <div class="canvas-pane canvas-pane-editor">
        <div class="canvas-pane-label">EDITOR · markdown</div>
        <textarea id="canvas-editor" spellcheck="false"
                  placeholder="# 标题
**多模态工坊** —— 写下你的想法，markdown 实时预览。
[link to existing memory](some_memory_key)
- list item
- another"></textarea>
      </div>
      <div class="canvas-pane canvas-pane-preview">
        <div class="canvas-pane-label">PREVIEW</div>
        <div id="canvas-preview" class="canvas-preview"></div>
      </div>
      <div class="canvas-rail">
        <div class="canvas-rail-section">
          <div class="canvas-rail-title">cofires neighbors</div>
          <div id="canvas-rail-cofires"><div class="canvas-rail-empty">none</div></div>
        </div>
        <div class="canvas-rail-section">
          <div class="canvas-rail-title">recent annotations</div>
          <div id="canvas-rail-annotations"><div class="canvas-rail-empty">none</div></div>
        </div>
        <div class="canvas-rail-section">
          <div class="canvas-rail-title">related reports</div>
          <div id="canvas-rail-reports"><div class="canvas-rail-empty">none</div></div>
        </div>
      </div>
    </div>
    <div class="canvas-foot">
      <span class="canvas-hint" id="canvas-hint">cmd/ctrl+enter to save · esc to close</span>
      <button id="canvas-save" type="button">沉淀 (save as working_doc)</button>
    </div>
  </div>

  <div id="footer">
    <span>circles = sqlite · rounded squares = markdown · cyan dotted = co-activation</span>
    <span class="hint" id="focus-hint"></span>
  </div>

<script>
const KIND_COLORS = {
  project:     "#5b8def",
  feedback:    "#e25c5c",
  reference:   "#7a7d8a",
  decision:    "#a06bdb",
  lesson:      "#5cc89a",
  vision:      "#e8c170",
  context:     "#5c9bc8",
  research:    "#c870a0",
  inventory:   "#7090a0",
  skill:       "#5cb6c8",
  fact:        "#809088",
  observation: "#a08070",
  todo:        "#d09060",
  concept:     "#9070d0",
  session_handoff: "#708090",
  // B-mode canvas product. Cyan paired with `expanded_from` edge — both
  // share the C3.6 attention-cyan family so working_docs visually thread
  // back to their originating node.
  working_doc: "#5cc8c8",
  annotation:  "#ffe070",
};
const DEFAULT_COLOR = "#7a7d8a";
function colorForKind(k) { return KIND_COLORS[k] || DEFAULT_COLOR; }

// Edge-type swatch colors mirror the cytoscape line-color rules below so the
// filter panel reads as a legend.
const EDGE_COLORS = {
  supersedes:   "#7a4ba8",
  summarizes:   "#a8895a",
  contradicts:  "#a85050",
  references:   "#5a5a72",
  annotates:    "#ffe070",
  coactivation: "#5cc8c8",
  cofires:      "#6dd4bd",
  // B-mode canvas-save edge. Solid cyan bezier — distinct from cofires
  // (also cyan, but dotted underlay) and references (cool gray straight).
  expanded_from: "#5cc8c8",
};
const DEFAULT_EDGE_COLOR = "#3a3a48";
function colorForEdgeType(t) { return EDGE_COLORS[t] || DEFAULT_EDGE_COLOR; }

function escapeHTML(s) {
  if (s == null) return "";
  return String(s).replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;");
}

// ── C3.5: access-driven visual size + halo ────────────────────
// Size = base + importance lift + log-scaled access lift.
//   importance ∈ [0,1] → up to +22
//   access (clamped log) → up to +18
// Halo (overlay) only kicks in when access > 0; padding & opacity grow
// with log(access) so frequently-visited nodes "glow" without making
// rare ones invisible. Logarithmic so a 100-click hub doesn't dwarf a
// 5-click warm node.
function nodeSize(importance, access) {
  const impLift = Math.min((importance || 0.5) * 22, 22);
  const accLift = Math.min(Math.log1p(access || 0) * 4, 18);
  return 16 + impLift + accLift;
}
function haloPad(access) {
  if (!access || access <= 0) return 0;
  return Math.min(Math.log1p(access) * 4, 16);
}
function haloOp(access) {
  if (!access || access <= 0) return 0;
  return Math.min(0.06 + Math.log1p(access) * 0.06, 0.38);
}

// Unix epoch seconds → "3d ago" / "5h ago" / "just now". Returns "" for
// missing/zero timestamps so the meta line stays clean for markdown nodes
// (which don't have a stored created_at).
function relTime(epochSecs) {
  if (!epochSecs) return "";
  const diff = Math.floor(Date.now() / 1000) - epochSecs;
  if (diff < 60)        return "just now";
  if (diff < 3600)      return Math.floor(diff / 60) + "m ago";
  if (diff < 86400)     return Math.floor(diff / 3600) + "h ago";
  if (diff < 86400 * 7) return Math.floor(diff / 86400) + "d ago";
  if (diff < 86400 * 30) return Math.floor(diff / (86400 * 7)) + "w ago";
  if (diff < 86400 * 365) return Math.floor(diff / (86400 * 30)) + "mo ago";
  return Math.floor(diff / (86400 * 365)) + "y ago";
}

// ── Global state ────────────────────────────────────────────────
const state = {
  cy: null,
  data: null,
  search: "",
  enabledSources: new Set(["sqlite", "markdown"]),
  enabledKinds: new Set(),
  enabledEdgeTypes: new Set(),  // empty == not yet populated; set on first load
  includeSkills: false,
  focused: null,        // currently-focused node id (or null)
};

// ── Load graph from server ──────────────────────────────────────
async function loadGraph() {
  const url = state.includeSkills ? "/api/graph?all=1" : "/api/graph";
  let data;
  try {
    const r = await fetch(url);
    data = await r.json();
  } catch (e) {
    document.getElementById("stats").textContent = "fetch failed";
    return;
  }
  state.data = data;

  const sqliteCount = data.nodes.filter(n => n.source === "sqlite").length;
  const markdownCount = data.nodes.filter(n => n.source === "markdown").length;
  const coactCount = data.edges.filter(e => e.type === "coactivation").length;
  const explicitCount = data.edges.length - coactCount;
  const edgesLabel = coactCount > 0
    ? `${explicitCount}+${coactCount}↔ edges`
    : `${data.edges.length} edges`;
  // C6: live "breath" — how many memories are fresh right now. Uses the
  // same FRESH_WINDOW + server now as the cyan ring so the badge and
  // ring agree. Cyan span echoes the ring color.
  const nowSecs = data.now || Math.floor(Date.now() / 1000);
  const freshCount = data.nodes.filter(n => {
    const la = n.last_accessed || 0;
    return la > 0 && (nowSecs - la) < FRESH_WINDOW_SECS;
  }).length;
  const baseLabel = markdownCount > 0
    ? `${sqliteCount} sqlite · ${markdownCount} markdown · ${edgesLabel}`
    : `${data.nodes.length} memories · ${edgesLabel}`;
  const freshBadge = freshCount > 0
    ? ` · <span style="color:#5cc8c8">${freshCount} fresh</span>`
    : "";
  document.getElementById("stats").innerHTML = baseLabel + freshBadge;

  // Populate filter panel from kinds + edge types present.
  const kindCounts = {};
  data.nodes.forEach(n => { kindCounts[n.kind] = (kindCounts[n.kind] || 0) + 1; });
  const kinds = Object.keys(kindCounts).sort();
  if (state.enabledKinds.size === 0) {
    // First load — enable all.
    kinds.forEach(k => state.enabledKinds.add(k));
  }

  const edgeTypeCounts = {};
  data.edges.forEach(e => {
    const t = e.type || "untyped";
    edgeTypeCounts[t] = (edgeTypeCounts[t] || 0) + 1;
  });
  const edgeTypes = Object.keys(edgeTypeCounts).sort();
  if (state.enabledEdgeTypes.size === 0) {
    edgeTypes.forEach(t => state.enabledEdgeTypes.add(t));
  }

  renderFilterPanel(kindCounts, edgeTypeCounts);

  buildCy(data);
}

// ── Build cytoscape ─────────────────────────────────────────────
// C5: freshness window = nodes accessed within the last hour wear a
// cyan ring. Server-side `data.now` is used (instead of client clock)
// so cross-machine drift doesn't fake-pulse stale nodes.
const FRESH_WINDOW_SECS = 3600;
function buildCy(data) {
  if (state.cy) state.cy.destroy();
  const nowSecs = data.now || Math.floor(Date.now() / 1000);

  const elements = [
    ...data.nodes.map(n => {
      const access = n.access || 0;
      const lastAccessed = n.last_accessed || 0;
      const ageSecs = lastAccessed > 0 ? (nowSecs - lastAccessed) : Number.MAX_SAFE_INTEGER;
      const fresh = ageSecs < FRESH_WINDOW_SECS ? 1 : 0;
      return {
        data: {
          id: n.id,
          label: n.label || n.id,
          kind: n.kind,
          importance: n.importance,
          access,
          color: colorForKind(n.kind),
          size: nodeSize(n.importance, access),
          haloPad: haloPad(access),
          haloOp: haloOp(access),
          source: n.source || "sqlite",
          fresh,
          ageSecs,
          searchHaystack: [
            n.id, n.kind, ...(n.tags || []),
            n.description || "",
          ].join(" ").toLowerCase(),
        }
      };
    }),
    ...data.edges.map(e => ({
      data: {
        id: `${e.source}__${e.target}__${e.type}`,
        source: e.source, target: e.target, type: e.type, weight: e.weight,
        // C3.6: coact edges carry raw fire-count; explicit edges leave undefined
        count: e.count,
      }
    })),
  ];

  state.cy = cytoscape({
    container: document.getElementById("cy"),
    elements,
    style: [
      { selector: "node", style: {
        "background-color": "data(color)",
        "width": "data(size)", "height": "data(size)",
        "label": "data(label)",
        "color": "#9a9aa8", "font-size": "9px", "font-family": "system-ui, sans-serif",
        "text-valign": "bottom", "text-halign": "center",
        "text-margin-y": 5, "text-max-width": "140px", "text-wrap": "ellipsis",
        "border-width": 1, "border-color": "#0a0a0f", "border-opacity": 0.7,
        "opacity": 0.92,
        // C3.5 access-driven halo. Overlay sits behind the node and tinted
        // by its kind color, so attention pattern is visible at a glance.
        "overlay-color": "data(color)",
        "overlay-padding": "data(haloPad)",
        "overlay-opacity": "data(haloOp)",
      }},
      { selector: "node[source='markdown']", style: {
        "shape": "round-rectangle",
        "border-width": 2, "border-color": "#e0e0ec", "border-opacity": 0.55,
        "opacity": 0.96,
      }},
      // C5 freshness: nodes accessed within FRESH_WINDOW_SECS get a cyan
      // ring matching the coactivation color, so "the system is breathing
      // here right now" reads as a single visual concept (recent click + the
      // attention edge it's about to create).
      { selector: "node[fresh = 1]", style: {
        "border-width": 2, "border-color": "#5cc8c8", "border-opacity": 0.85,
      }},
      { selector: "node.faded", style: {
        "opacity": 0.08, "text-opacity": 0,
      }},
      { selector: "node.match", style: {
        "border-width": 3, "border-color": "#ffe070", "border-opacity": 1,
        "color": "#ffe070", "z-index": 999,
      }},
      { selector: "node.focus-center", style: {
        "border-width": 3, "border-color": "#ffffff", "border-opacity": 1,
        "color": "#ffffff", "font-size": "11px", "z-index": 999, "opacity": 1,
      }},
      { selector: "node.focus-neighbor", style: {
        "color": "#e0e0ec", "z-index": 998, "opacity": 1,
      }},
      { selector: "node:selected", style: {
        "border-width": 2.5, "border-color": "#ffffff", "border-opacity": 1,
      }},
      { selector: "edge", style: {
        "width": "mapData(weight, 0, 1, 0.4, 2.5)",
        "line-color": "#2a2a38", "target-arrow-shape": "none",
        "curve-style": "straight", "opacity": 0.55,
      }},
      { selector: "edge[type='supersedes']", style: { "line-color": "#7a4ba8", "opacity": 0.8 }},
      { selector: "edge[type='summarizes']", style: { "line-color": "#a8895a", "opacity": 0.75, "line-style": "dashed" }},
      { selector: "edge[type='contradicts']", style: { "line-color": "#a85050", "opacity": 0.75, "line-style": "dashed" }},
      { selector: "edge[type='references']", style: {
        "line-color": "#5a5a72", "line-style": "dotted", "opacity": 0.7, "width": 1,
      }},
      { selector: "edge[type='annotates']", style: {
        "line-color": "#ffe070", "opacity": 0.85, "width": 1.6,
      }},
      // B-mode canvas-save edge. Solid cyan bezier — paired by color
      // with `working_doc` node fill. Bezier (vs straight) lets it
      // visually breathe inside dense Hebbian clusters.
      { selector: "edge[type='expanded_from']", style: {
        "line-color": "#5cc8c8",
        "curve-style": "bezier",
        "opacity": 0.78,
        "width": 1.5,
      }},
      // C3.6 co-activation: Hebbian "fire together" pairs, NO explicit edge
      // between them. Cyan curved underlay so the structural skeleton
      // (straight, neutral-toned) stays visually dominant; opacity & width
      // ramp with count so a 9-fire pair is noticeably brighter than a
      // 2-fire one.
      { selector: "edge[type='coactivation']", style: {
        "line-color": "#5cc8c8",
        "line-style": "dotted",
        "curve-style": "bezier",
        "opacity": "mapData(weight, 0.2, 0.9, 0.18, 0.55)",
        "width":   "mapData(weight, 0.2, 0.9, 0.5, 1.6)",
      }},
      { selector: "edge.faded", style: { "opacity": 0.04 }},
      { selector: "edge.focus-edge", style: {
        "line-color": "#9a9aa8", "opacity": 0.85, "width": 2,
      }},
      // Freshly-sedimented node: cytoscape's overlay-* gives a soft
      // cyan ring that telegraphs "this is where your canvas-save
      // landed". Removed after ~1.5s by the saveCanvas flow.
      { selector: "node.new-sediment", style: {
        "overlay-color": "#5cc8c8",
        "overlay-padding": 16,
        "overlay-opacity": 0.42,
      }},
    ],
    layout: {
      name: "cose",
      idealEdgeLength: 100, nodeOverlap: 20, refresh: 20, fit: true, padding: 40,
      randomize: false, componentSpacing: 80, nodeRepulsion: 400000,
      edgeElasticity: 100, nestingFactor: 5, gravity: 80,
      numIter: 1000, initialTemp: 200, coolingFactor: 0.95, minTemp: 1.0,
    },
    minZoom: 0.15, maxZoom: 4.0, wheelSensitivity: 0.2,
  });

  // Bind interactions
  state.cy.on("tap", "node", (evt) => {
    const id = evt.target.id();
    focusOnNode(id);
    showSidePanel(id);
  });
  state.cy.on("tap", (evt) => {
    if (evt.target === state.cy) {
      clearFocus();
      document.getElementById("panel").classList.add("hidden");
      // Reclaim the space — cy fills the viewport again.
      state.cy.resize();
    }
  });

  applyVisualState();
}

// ── Filter panel rendering ──────────────────────────────────────
function renderFilterPanel(kindCounts, edgeTypeCounts) {
  const kinds = Object.keys(kindCounts).sort();
  const edgeTypes = Object.keys(edgeTypeCounts).sort();
  const html = `
    <div class="section">
      <h3>Source</h3>
      <label><input type="checkbox" data-source="sqlite" ${state.enabledSources.has("sqlite") ? "checked" : ""}> circle · sqlite</label>
      <label><input type="checkbox" data-source="markdown" ${state.enabledSources.has("markdown") ? "checked" : ""}> square · markdown</label>
    </div>
    <div class="section">
      <h3>Kind</h3>
      <div class="actions">
        <button id="kind-all">all</button>
        <button id="kind-none">none</button>
      </div>
      ${kinds.map(k => `
        <label>
          <input type="checkbox" data-kind="${escapeHTML(k)}" ${state.enabledKinds.has(k) ? "checked" : ""}>
          <span class="swatch" style="background:${colorForKind(k)}"></span>
          ${escapeHTML(k)}
          <span class="count">${kindCounts[k]}</span>
        </label>
      `).join("")}
    </div>
    <div class="section">
      <h3>Edge type</h3>
      <div class="actions">
        <button id="edge-all">all</button>
        <button id="edge-none">none</button>
      </div>
      ${edgeTypes.map(t => `
        <label>
          <input type="checkbox" data-edge-type="${escapeHTML(t)}" ${state.enabledEdgeTypes.has(t) ? "checked" : ""}>
          <span class="swatch" style="background:${colorForEdgeType(t)}"></span>
          ${escapeHTML(t)}
          <span class="count">${edgeTypeCounts[t]}</span>
        </label>
      `).join("")}
    </div>
    <div class="section">
      <label>
        <input type="checkbox" id="include-skills" ${state.includeSkills ? "checked" : ""}>
        include indexed skills
      </label>
    </div>
  `;
  const panel = document.getElementById("filter-panel");
  panel.innerHTML = html;

  panel.querySelectorAll("input[data-source]").forEach(el => {
    el.addEventListener("change", () => {
      if (el.checked) state.enabledSources.add(el.dataset.source);
      else state.enabledSources.delete(el.dataset.source);
      applyVisualState();
    });
  });
  panel.querySelectorAll("input[data-kind]").forEach(el => {
    el.addEventListener("change", () => {
      if (el.checked) state.enabledKinds.add(el.dataset.kind);
      else state.enabledKinds.delete(el.dataset.kind);
      applyVisualState();
    });
  });
  panel.querySelector("#kind-all").addEventListener("click", () => {
    kinds.forEach(k => state.enabledKinds.add(k));
    panel.querySelectorAll("input[data-kind]").forEach(el => el.checked = true);
    applyVisualState();
  });
  panel.querySelector("#kind-none").addEventListener("click", () => {
    state.enabledKinds.clear();
    panel.querySelectorAll("input[data-kind]").forEach(el => el.checked = false);
    applyVisualState();
  });
  panel.querySelectorAll("input[data-edge-type]").forEach(el => {
    el.addEventListener("change", () => {
      if (el.checked) state.enabledEdgeTypes.add(el.dataset.edgeType);
      else state.enabledEdgeTypes.delete(el.dataset.edgeType);
      applyVisualState();
    });
  });
  panel.querySelector("#edge-all").addEventListener("click", () => {
    edgeTypes.forEach(t => state.enabledEdgeTypes.add(t));
    panel.querySelectorAll("input[data-edge-type]").forEach(el => el.checked = true);
    applyVisualState();
  });
  panel.querySelector("#edge-none").addEventListener("click", () => {
    state.enabledEdgeTypes.clear();
    panel.querySelectorAll("input[data-edge-type]").forEach(el => el.checked = false);
    applyVisualState();
  });
  panel.querySelector("#include-skills").addEventListener("change", (e) => {
    state.includeSkills = e.target.checked;
    loadGraph();  // re-fetch (server returns different node set)
  });
}

// ── Visual state machine ────────────────────────────────────────
// Combines: source filter + kind filter + search highlight + focus highlight.
// Order matters: filters hide nodes (faded), search marks (match), focus
// overrides (focus-center / focus-neighbor / focus-edge / faded).
function applyVisualState() {
  if (!state.cy) return;
  const cy = state.cy;
  const term = state.search.trim().toLowerCase();

  // Reset classes.
  cy.elements().removeClass("faded match focus-center focus-neighbor focus-edge");

  // Filter-fade: nodes failing source/kind get .faded.
  cy.nodes().forEach(n => {
    const d = n.data();
    const sourceOk = state.enabledSources.has(d.source);
    const kindOk = state.enabledKinds.has(d.kind);
    if (!sourceOk || !kindOk) n.addClass("faded");
  });

  // Edge-fade: edges whose either endpoint is faded → faded. Also fade
  // edges whose type is excluded from the edge-type filter, so users can
  // hide e.g. the cyan coactivation underlay to read the structural
  // skeleton clearly.
  cy.edges().forEach(e => {
    const t = e.data("type") || "untyped";
    const typeOk = state.enabledEdgeTypes.has(t);
    if (!typeOk
        || e.source().hasClass("faded")
        || e.target().hasClass("faded")) {
      e.addClass("faded");
    }
  });

  // Search-mark: visible nodes matching term get .match.
  if (term) {
    cy.nodes().not(".faded").forEach(n => {
      const hay = n.data("searchHaystack") || "";
      if (hay.includes(term)) n.addClass("match");
      else n.addClass("faded");  // dim non-matches
    });
    // Re-fade edges since some nodes are now faded.
    cy.edges().not(".faded").forEach(e => {
      if (e.source().hasClass("faded") || e.target().hasClass("faded")) {
        e.addClass("faded");
      }
    });
  }

  // Focus overlay: ego network of focused node.
  if (state.focused) {
    const node = cy.getElementById(state.focused);
    if (node && node.length > 0) {
      const ego = node.closedNeighborhood();
      // Everything outside ego is faded.
      cy.elements().not(ego).addClass("faded");
      ego.removeClass("faded");
      // Mark the center + neighbors + edges.
      node.addClass("focus-center");
      ego.nodes().not(node).addClass("focus-neighbor");
      ego.edges().addClass("focus-edge");
    }
  }
}

function focusOnNode(id) {
  state.focused = id;
  document.getElementById("focus-hint").textContent =
    "focus: " + id + " · click background to release";
  applyVisualState();
  // Smooth pan to the node.
  const n = state.cy.getElementById(id);
  if (n && n.length > 0) {
    state.cy.animate({ center: { eles: n }, duration: 300, easing: "ease-out" });
  }
}

function clearFocus() {
  state.focused = null;
  document.getElementById("focus-hint").textContent = "";
  applyVisualState();
}

// ── Side panel ──────────────────────────────────────────────────
async function showSidePanel(id) {
  const panel = document.getElementById("panel");
  panel.classList.remove("hidden");
  // cytoscape's canvases were sized for the pre-panel viewport. Tell it
  // to re-measure so the new (narrower) cy area fits properly.
  if (state.cy) state.cy.resize();
  panel.innerHTML = `<div class="placeholder">loading…</div>`;
  try {
    const r = await fetch(`/api/memory/${encodeURIComponent(id)}`);
    if (!r.ok) {
      panel.innerHTML = `<div class="placeholder">${r.status} · ${escapeHTML(r.statusText)}</div>`;
      return;
    }
    const m = await r.json();
    // C3.5 live-update: api_memory just bumped access_count server-side.
    // Reflect the new size/halo immediately on the clicked node so the user
    // sees their attention land. cytoscape.data() updates without re-layout.
    if (state.cy && m.source !== "markdown") {
      const n = state.cy.getElementById(m.key);
      if (n && n.length > 0) {
        const access = m.access_count || 0;
        n.data("access", access);
        n.data("size", nodeSize(m.importance, access));
        n.data("haloPad", haloPad(access));
        n.data("haloOp", haloOp(access));
        // C5: this click bumped last_accessed_at server-side, so the node
        // is fresh by definition. Light up the cyan ring without waiting
        // for the next /api/graph refresh.
        n.data("fresh", 1);
        n.data("ageSecs", 0);
      }
    }
    const sourceLabel = m.source === "markdown" ? "markdown" : "sqlite";
    const descBlock = m.description
      ? `<div class="desc">${escapeHTML(m.description)}</div>` : "";
    const created = relTime(m.created_at);
    const updated = relTime(m.updated_at);
    const timeBlock = created || updated
      ? `<div class="meta-time">
          ${created ? `created ${created}` : ""}
          ${updated && updated !== created ? ` · updated ${updated}` : ""}
        </div>`
      : "";
    panel.innerHTML = `
      <h2>${escapeHTML(m.key)}</h2>
      <div class="meta">
        ${escapeHTML(m.kind)} · ${sourceLabel} · importance ${(m.importance || 0).toFixed(2)} · access ${m.access_count || 0}
      </div>
      ${timeBlock}
      ${descBlock}
      <div class="tags">
        ${(m.tags || []).map(t => `<span class="tag">${escapeHTML(t)}</span>`).join("")}
      </div>
      <div class="content">${escapeHTML(m.content || "")}</div>
      <div class="reports-section" id="reports-section" style="display:none">
        <div class="reports-title">related reports</div>
        <div class="reports-list" id="reports-list"></div>
      </div>
      <div class="annotate-section">
        <button class="annotate-toggle" type="button">✍ annotate this node</button>
        <button class="canvas-expand-btn" type="button">📐 expand canvas</button>
        <div class="annotate-form">
          <textarea placeholder="your thought… (cmd/ctrl+enter to save)"></textarea>
          <div class="row">
            <span class="hint">→ writes a new sqlite memory linked here</span>
            <button class="cancel" type="button">cancel</button>
            <button class="save" type="button">save</button>
          </div>
        </div>
      </div>
    `;
    bindAnnotate(panel, m.key);
    bindCanvasExpand(panel, m);
    loadRelatedReports(m.key);
  } catch (e) {
    panel.innerHTML = `<div class="placeholder">error: ${escapeHTML(String(e))}</div>`;
  }
}

// ── Annotate form (C1: closes the 呼吸 loop) ────────────────────
function bindAnnotate(panel, targetKey) {
  const toggle = panel.querySelector(".annotate-toggle");
  const form = panel.querySelector(".annotate-form");
  const textarea = panel.querySelector(".annotate-form textarea");
  const cancelBtn = panel.querySelector(".annotate-form .cancel");
  const saveBtn = panel.querySelector(".annotate-form .save");
  const hint = panel.querySelector(".annotate-form .hint");
  const defaultHintText = hint.textContent;
  if (!toggle || !form) return;

  toggle.addEventListener("click", () => {
    form.classList.add("open");
    toggle.style.display = "none";
    textarea.focus();
  });
  cancelBtn.addEventListener("click", () => {
    form.classList.remove("open");
    toggle.style.display = "";
    textarea.value = "";
    hint.textContent = defaultHintText;
    hint.className = "hint";
  });
  const submit = async () => {
    const body = textarea.value.trim();
    if (!body) {
      hint.textContent = "empty annotation — write something first";
      hint.className = "hint error";
      return;
    }
    saveBtn.disabled = true;
    cancelBtn.disabled = true;
    hint.textContent = "saving…";
    hint.className = "hint";
    try {
      const r = await fetch("/api/annotate", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ target_key: targetKey, content: body }),
      });
      if (!r.ok) {
        const txt = await r.text();
        hint.textContent = `error · ${r.status} · ${txt.slice(0, 80)}`;
        hint.className = "hint error";
        saveBtn.disabled = false;
        cancelBtn.disabled = false;
        return;
      }
      const out = await r.json();
      hint.textContent = `✓ saved as ${out.key}`;
      hint.className = "hint ok";
      textarea.value = "";
      // Reload the graph so the new node + edge appear. Keep focus on
      // the target so the user sees the new annotation pop in next to it.
      await loadGraph();
      const focusedKey = targetKey;
      setTimeout(() => {
        if (state.cy && state.cy.getElementById(focusedKey).length > 0) {
          focusOnNode(focusedKey);
        }
      }, 50);
    } catch (e) {
      hint.textContent = "error · " + String(e).slice(0, 80);
      hint.className = "hint error";
      saveBtn.disabled = false;
      cancelBtn.disabled = false;
    }
  };
  saveBtn.addEventListener("click", submit);
  textarea.addEventListener("keydown", (e) => {
    if ((e.metaKey || e.ctrlKey) && e.key === "Enter") {
      e.preventDefault();
      submit();
    }
  });
}

// ── Top-bar bindings ────────────────────────────────────────────
document.getElementById("search").addEventListener("input", (e) => {
  state.search = e.target.value;
  applyVisualState();
});

document.getElementById("filter-btn").addEventListener("click", () => {
  const p = document.getElementById("filter-panel");
  const btn = document.getElementById("filter-btn");
  if (p.classList.contains("hidden")) {
    p.classList.remove("hidden");
    btn.classList.add("active");
  } else {
    p.classList.add("hidden");
    btn.classList.remove("active");
  }
});

// Keyboard: `/` focuses the search box; Esc clears search + focus.
document.addEventListener("keydown", (e) => {
  if (e.key === "/" && document.activeElement !== document.getElementById("search")) {
    e.preventDefault();
    document.getElementById("search").focus();
  } else if (e.key === "Escape") {
    document.getElementById("search").value = "";
    state.search = "";
    clearFocus();
  }
});

// Fetch reports that mention `key` and inject links into the side panel.
// Hidden when zero matches so the panel stays clean for nodes that
// haven't been promoted/audited.
async function loadRelatedReports(key) {
  try {
    const r = await fetch(`/api/reports?key=${encodeURIComponent(key)}`);
    if (!r.ok) return;
    const j = await r.json();
    const items = j.items || [];
    if (items.length === 0) return;
    const section = document.getElementById("reports-section");
    const list = document.getElementById("reports-list");
    if (!section || !list) return;
    list.innerHTML = items.map(it => {
      const rel = relTime(it.mtime) || "";
      return `<a href="/reports/${encodeURIComponent(it.filename)}" target="_blank" rel="noopener">
        <span>${escapeHTML(it.label)}</span>
        <span class="report-meta">${rel} · ${it.mentions}×</span>
      </a>`;
    }).join("");
    section.style.display = "block";
  } catch (e) {
    // Best-effort — leave the section hidden on any error.
  }
}

// ── B M0 canvas overlay (呼吸式画布) ────────────────────────────
//
// "画布是交互蓝图，palace 是结果呈现" — vision_breathing_canvas.md.
// The overlay is a fullscreen workshop bound to a single Palace node.
// Save sediments a `kind=working_doc` memory + `expanded_from` edge,
// playing a brief fade-to-ice animation before the new node lands in
// the graph. Width is driven by `--canvas-width` (M0 = 100vw); M1 will
// shrink it to leave Palace partially visible.
const canvasState = { current: null }; // current memory being expanded

function bindCanvasExpand(panel, memory) {
  const btn = panel.querySelector(".canvas-expand-btn");
  if (!btn) return;
  btn.addEventListener("click", () => openCanvas(memory));
}

function openCanvas(memory) {
  canvasState.current = memory;
  const overlay = document.getElementById("canvas-overlay");
  if (!overlay) return;
  document.getElementById("canvas-focus-key").textContent = memory.key;
  document.getElementById("canvas-focus-meta").textContent =
    `${memory.kind || "memory"} · ${memory.source || "sqlite"} · importance ${(memory.importance || 0).toFixed(2)}`;
  const editor = document.getElementById("canvas-editor");
  editor.value = "";
  renderMarkdownPreview(""); // empty placeholder
  resetCanvasHint();
  loadCanvasRail(memory);
  overlay.classList.remove("hidden", "leaving", "freezing");
  overlay.classList.add("entering");
  // Tell the body Palace should recede (CSS handles the scale + dim).
  document.body.classList.add("canvas-open");
  // Force reflow so the entering→base transition runs.
  // Reading `offsetHeight` flushes the previous frame's layout.
  // eslint-disable-next-line no-unused-expressions
  overlay.offsetHeight;
  overlay.classList.remove("entering");
  setTimeout(() => editor.focus(), 60);
}

function closeCanvas() {
  const overlay = document.getElementById("canvas-overlay");
  if (!overlay || overlay.classList.contains("hidden")) return;
  overlay.classList.add("leaving");
  // Drop canvas-open immediately so Palace begins scaling back to 1.0
  // in parallel with the overlay slide-out (one motion, not sequential).
  document.body.classList.remove("canvas-open");
  setTimeout(() => {
    overlay.classList.add("hidden");
    overlay.classList.remove("leaving", "freezing");
    canvasState.current = null;
  }, 320); // matches --canvas-fade
}

function toggleCanvasNarrow() {
  const narrow = document.body.classList.toggle("canvas-narrow");
  const btn = document.getElementById("canvas-narrow-toggle");
  if (btn) btn.textContent = narrow ? "⊞ fullscreen" : "⊟ narrow";
  // Cytoscape needs a resize when the visible width swings — otherwise
  // its internal canvas keeps the old metrics and node positions look
  // off-center until the next layout pass.
  if (state.cy) state.cy.resize();
}

function resetCanvasHint() {
  const hint = document.getElementById("canvas-hint");
  hint.textContent = "cmd/ctrl+enter to save · esc to close";
  hint.className = "canvas-hint";
}

// Mini markdown renderer — self-contained, no external deps. Handles
// the subset agent-authored notes actually use: headings, bold/italic,
// inline + fenced code, lists, links, blockquotes, paragraphs. Anything
// not recognized passes through as escaped text.
function renderMarkdown(src) {
  if (!src || !src.trim()) {
    return `<div class="placeholder">live preview · type in the editor</div>`;
  }
  const lines = src.replace(/\r\n/g, "\n").split("\n");
  const out = [];
  let i = 0;
  let inCode = false;
  let codeBuf = [];
  let listOpen = null; // "ul" | "ol" | null
  let paraBuf = [];
  const closePara = () => {
    if (paraBuf.length) {
      out.push(`<p>${inlineMd(paraBuf.join(" "))}</p>`);
      paraBuf = [];
    }
  };
  const closeList = () => {
    if (listOpen) {
      out.push(`</${listOpen}>`);
      listOpen = null;
    }
  };
  while (i < lines.length) {
    const ln = lines[i];
    if (ln.startsWith("```")) {
      closePara(); closeList();
      if (inCode) {
        out.push(`<pre><code>${escapeHTML(codeBuf.join("\n"))}</code></pre>`);
        codeBuf = [];
        inCode = false;
      } else {
        inCode = true;
      }
      i++;
      continue;
    }
    if (inCode) { codeBuf.push(ln); i++; continue; }
    const h = ln.match(/^(#{1,3})\s+(.+)/);
    if (h) {
      closePara(); closeList();
      const level = h[1].length;
      out.push(`<h${level}>${inlineMd(h[2])}</h${level}>`);
      i++; continue;
    }
    const bq = ln.match(/^>\s?(.*)/);
    if (bq) {
      closePara(); closeList();
      const buf = [bq[1]];
      while (i + 1 < lines.length && /^>\s?/.test(lines[i+1])) {
        buf.push(lines[++i].replace(/^>\s?/, ""));
      }
      out.push(`<blockquote>${inlineMd(buf.join(" "))}</blockquote>`);
      i++; continue;
    }
    const ul = ln.match(/^[-*]\s+(.+)/);
    if (ul) {
      closePara();
      if (listOpen !== "ul") { closeList(); out.push("<ul>"); listOpen = "ul"; }
      out.push(`<li>${inlineMd(ul[1])}</li>`);
      i++; continue;
    }
    const ol = ln.match(/^(\d+)\.\s+(.+)/);
    if (ol) {
      closePara();
      if (listOpen !== "ol") { closeList(); out.push("<ol>"); listOpen = "ol"; }
      out.push(`<li>${inlineMd(ol[2])}</li>`);
      i++; continue;
    }
    if (!ln.trim()) {
      closePara(); closeList();
      i++; continue;
    }
    paraBuf.push(ln);
    i++;
  }
  if (inCode) {
    // Unclosed fence — render what we have so the user sees their typing.
    out.push(`<pre><code>${escapeHTML(codeBuf.join("\n"))}</code></pre>`);
  }
  closePara(); closeList();
  return out.join("\n");
}

// Inline markdown (within a paragraph/heading/list item):
// **bold** *italic* `code` [text](url). Order matters: code first
// (so its contents aren't re-processed), then links, then bold, italic.
function inlineMd(s) {
  // Tokenize code spans first to protect them from other rules.
  const codeTokens = [];
  let safe = s.replace(/`([^`]+)`/g, (_m, p1) => {
    codeTokens.push(p1);
    return `␀C${codeTokens.length - 1}␀`;
  });
  safe = escapeHTML(safe);
  // [text](url) — basic, no nested brackets.
  safe = safe.replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, (_m, t, u) => {
    return `<a href="${escapeHTML(u)}" target="_blank" rel="noopener">${t}</a>`;
  });
  safe = safe.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
  safe = safe.replace(/(^|[^*])\*([^*\n]+)\*/g, "$1<em>$2</em>");
  safe = safe.replace(/␀C(\d+)␀/g, (_m, idx) => {
    return `<code>${escapeHTML(codeTokens[parseInt(idx, 10)])}</code>`;
  });
  return safe;
}

function renderMarkdownPreview(src) {
  document.getElementById("canvas-preview").innerHTML = renderMarkdown(src);
}

// Populate the right rail with three sections of context. Cofires
// neighbors come from the cytoscape graph (already loaded). Recent
// annotations + related reports re-use existing endpoints.
async function loadCanvasRail(memory) {
  // 1. cofires neighbors — derive from the loaded graph data.
  const cofiresEl = document.getElementById("canvas-rail-cofires");
  cofiresEl.parentElement.classList.remove("canvas-rail-cofires"); // ensure parent gets the class
  cofiresEl.parentElement.classList.add("canvas-rail-cofires");
  const cofiresList = neighborsOfType(memory.key, "cofires").slice(0, 8);
  if (cofiresList.length) {
    cofiresEl.innerHTML = cofiresList.map(k =>
      `<a href="/?focus=${encodeURIComponent(k)}" title="${escapeHTML(k)}">${escapeHTML(k)}</a>`
    ).join("");
  } else {
    cofiresEl.innerHTML = `<div class="canvas-rail-empty">none yet</div>`;
  }

  // 2. recent annotations — sqlite memories with `palace` tag, sorted by mtime.
  const annosEl = document.getElementById("canvas-rail-annotations");
  annosEl.parentElement.classList.add("canvas-rail-annotations");
  const annoNeighbors = neighborsOfType(memory.key, "annotates").slice(0, 6);
  if (annoNeighbors.length) {
    annosEl.innerHTML = annoNeighbors.map(k =>
      `<a href="/?focus=${encodeURIComponent(k)}" title="${escapeHTML(k)}">${escapeHTML(k)}</a>`
    ).join("");
  } else {
    annosEl.innerHTML = `<div class="canvas-rail-empty">none yet</div>`;
  }

  // 3. related reports — same /api/reports endpoint the side panel uses.
  const reportsEl = document.getElementById("canvas-rail-reports");
  reportsEl.parentElement.classList.add("canvas-rail-reports");
  try {
    const r = await fetch(`/api/reports?key=${encodeURIComponent(memory.key)}`);
    const j = await r.json();
    const items = (j.items || []).slice(0, 6);
    if (items.length) {
      reportsEl.innerHTML = items.map(it =>
        `<a href="/reports/${encodeURIComponent(it.filename)}" target="_blank" rel="noopener" title="${escapeHTML(it.filename)}">${escapeHTML(it.label)} · ${it.mentions}×</a>`
      ).join("");
    } else {
      reportsEl.innerHTML = `<div class="canvas-rail-empty">none yet</div>`;
    }
  } catch (e) {
    reportsEl.innerHTML = `<div class="canvas-rail-empty">error</div>`;
  }
}

function neighborsOfType(key, edgeType) {
  if (!state.cy) return [];
  const node = state.cy.getElementById(key);
  if (!node || node.length === 0) return [];
  const edges = node.connectedEdges().filter(e => e.data("type") === edgeType);
  const keys = new Set();
  edges.forEach(e => {
    const src = e.source().id();
    const tgt = e.target().id();
    if (src !== key) keys.add(src);
    if (tgt !== key) keys.add(tgt);
  });
  return Array.from(keys);
}

async function saveCanvas() {
  if (!canvasState.current) return;
  const editor = document.getElementById("canvas-editor");
  const saveBtn = document.getElementById("canvas-save");
  const hint = document.getElementById("canvas-hint");
  const body = editor.value.trim();
  if (!body) {
    hint.textContent = "editor is empty — nothing to sediment";
    hint.className = "canvas-hint error";
    return;
  }
  saveBtn.disabled = true;
  hint.textContent = "saving…";
  hint.className = "canvas-hint";
  const target = canvasState.current.key;
  try {
    const r = await fetch("/api/annotate", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        target_key: target,
        content: body,
        kind: "working_doc",
        edge_type: "expanded_from",
        weight: 0.7,
        importance: 0.65,
      }),
    });
    if (!r.ok) {
      const txt = await r.text();
      throw new Error(`${r.status} · ${txt.slice(0, 120)}`);
    }
    const j = await r.json();
    // Fade-to-ice: dim + saturate-down for ~900ms before closing.
    document.getElementById("canvas-overlay").classList.add("freezing");
    hint.textContent = `沉淀 · ${j.key} (${j.edge})`;
    hint.className = "canvas-hint ok";
    setTimeout(async () => {
      closeCanvas();
      await loadGraph();
      // Land focus on the new working_doc so the user sees the sediment.
      // Add `.new-sediment` class for ~1.5s — cytoscape's overlay-* gives
      // a soft cyan ring telegraphing "this is the node you just made".
      // The vision calls this the "结冰" moment of the breathing cycle.
      setTimeout(() => {
        if (state.cy && state.cy.getElementById(j.key).length > 0) {
          focusOnNode(j.key);
          showSidePanel(j.key);
          const newNode = state.cy.getElementById(j.key);
          newNode.addClass("new-sediment");
          setTimeout(() => newNode.removeClass("new-sediment"), 1500);
        }
      }, 60);
    }, 900);
  } catch (e) {
    hint.textContent = "error · " + String(e).slice(0, 100);
    hint.className = "canvas-hint error";
    saveBtn.disabled = false;
  }
}

// Wire static handlers once at boot.
function bindCanvasGlobals() {
  document.querySelector("#canvas-overlay .canvas-close")
    .addEventListener("click", closeCanvas);
  document.getElementById("canvas-narrow-toggle")
    .addEventListener("click", toggleCanvasNarrow);
  const editor = document.getElementById("canvas-editor");
  editor.addEventListener("input", () => renderMarkdownPreview(editor.value));
  editor.addEventListener("keydown", (e) => {
    if ((e.metaKey || e.ctrlKey) && e.key === "Enter") {
      e.preventDefault();
      saveCanvas();
    }
  });
  document.getElementById("canvas-save").addEventListener("click", saveCanvas);
  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape") {
      const overlay = document.getElementById("canvas-overlay");
      if (overlay && !overlay.classList.contains("hidden")) {
        e.preventDefault();
        closeCanvas();
      }
    } else if ((e.metaKey || e.ctrlKey) && e.key === "\\") {
      // cmd/ctrl+\ — toggle narrow mode while canvas is open. No-op if
      // canvas isn't open so the shortcut doesn't surprise users on
      // the regular Palace view.
      const overlay = document.getElementById("canvas-overlay");
      if (overlay && !overlay.classList.contains("hidden")) {
        e.preventDefault();
        toggleCanvasNarrow();
      }
    }
  });
}

// Boot. After the graph loads, honor a `?focus=KEY` URL parameter so
// inbound deep-links from `dream promote --html` reports land directly
// on the referenced node (focus + side panel) instead of the empty
// overview. Keys that aren't in the current graph still get a side
// panel via /api/memory — the focus highlight is best-effort.
(async () => {
  await loadGraph();
  bindCanvasGlobals();
  const focus = new URLSearchParams(location.search).get("focus");
  if (!focus) return;
  if (state.cy && state.cy.getElementById(focus).length > 0) {
    focusOnNode(focus);
  }
  showSidePanel(focus);
})();
</script>
