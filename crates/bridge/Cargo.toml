[package]
name = "ab-bridge"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
# `onnx-embed` is on by default so source builds (`cargo install --git`,
# local `cargo build`) keep the full sentence-transformer embedding
# backend. Prebuilt release binaries are built with `--no-default-features`
# to ship a smaller, ONNX-free tarball that runs on any glibc and on
# x86_64-apple-darwin (where ort-sys has no prebuilt). The hash-only
# fallback in ab-store keeps memory/embedding APIs functional without ONNX.
default = ["onnx-embed"]
onnx-embed = ["ab-store/onnx-embed"]
linux-native-avatar = ["dep:smithay-client-toolkit", "dep:wayland-client"]
biocortex-retrieval-shadow = []
# Reserved marker for legacy Seed substrate UX. The AB runtime no longer links
# `ab-seed-bridge`; CLI/MCP surfaces report build-time disabled. Build the
# standalone `crates/seed-bridge` crate for historical replay experiments.
seed-substrate = []

[dependencies]
ab-core.workspace = true
ab-world-core.workspace = true
ab-notifier.workspace = true
ab-store.workspace = true
ab-terminal.workspace = true
ab-browser.workspace = true
ab-agent.workspace = true
ab-mcp.workspace = true
ab-oob-alert.workspace = true
base64.workspace = true
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2 = "0.10"
thiserror.workspace = true
anyhow.workspace = true
tokio.workspace = true
futures.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
clap.workspace = true
walkdir.workspace = true

# v20: HTTP daemon for cross-machine forum + presence over Tailscale
axum = "0.7"
# v20 Stage 2: HTTP client for `peer:` arg routing.
# default-features=false drops the native-tls dep; rustls-tls is needed
# for the Tailscale REST API (api.tailscale.com over HTTPS — see
# tailscale_api.rs); peer-to-peer tailnet calls themselves are plain HTTP.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
# C2 lockfile primitive (kill(pid, 0) liveness probe).
libc = "0.2"
png = "0.17"

[target.'cfg(target_os = "linux")'.dependencies]
smithay-client-toolkit = { version = "0.20", optional = true }
wayland-client = { version = "0.31", optional = true }

[dev-dependencies]
tempfile = "3"

[[bin]]
name = "agent-bridge"
path = "src/main.rs"
