[package]
name = "ab-bridge"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
# `onnx-embed` is on by default so source builds (`cargo install --git`,
# local `cargo build`) keep the full sentence-transformer embedding
# backend. Prebuilt release binaries are built with `--no-default-features`
# to ship a smaller, ONNX-free tarball that runs on any glibc and on
# x86_64-apple-darwin (where ort-sys has no prebuilt). The hash-only
# fallback in ab-store keeps memory/embedding APIs functional without ONNX.
default = ["onnx-embed"]
onnx-embed = ["ab-store/onnx-embed"]

[dependencies]
ab-core.workspace = true
ab-notifier.workspace = true
ab-store.workspace = true
ab-terminal.workspace = true
ab-browser.workspace = true
ab-agent.workspace = true
ab-mcp.workspace = true
ab-seed-bridge = { path = "../seed-bridge" }
ab-oob-alert.workspace = true
base64.workspace = true
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
anyhow.workspace = true
tokio.workspace = true
futures.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
clap.workspace = true
walkdir.workspace = true

# v20: HTTP daemon for cross-machine forum + presence over Tailscale
axum = "0.7"
# v20 Stage 2: HTTP client for `peer:` arg routing.
# default-features=false drops the native-tls dep; rustls-tls is needed
# for the Tailscale REST API (api.tailscale.com over HTTPS — see
# tailscale_api.rs); peer-to-peer tailnet calls themselves are plain HTTP.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

[[bin]]
name = "agent-bridge"
path = "src/main.rs"
