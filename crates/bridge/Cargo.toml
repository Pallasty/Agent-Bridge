[package]
name = "ab-bridge"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
# Source builds enable `onnx-embed` by default so `cargo install --git` and
# local `cargo build` keep the full sentence-transformer backend. Operators
# can use `--no-default-features` for a smaller local ONNX-free build; the
# hash-only fallback in ab-store keeps memory/embedding APIs functional.
default = ["onnx-embed"]
onnx-embed = ["ab-store/onnx-embed"]
linux-native-avatar = ["dep:smithay-client-toolkit", "dep:wayland-client"]
biocortex-retrieval-shadow = []
biocortex-retrieval-opt-in = ["biocortex-retrieval-shadow"]
episode-observation-slice-c1 = []
temporal-evidence-s4-synthetic = ["ab-store/temporal-evidence-s4-synthetic"]
temporal-evidence-s5-candidate-synthetic = [
    "temporal-evidence-s4-synthetic",
    "ab-store/temporal-evidence-s5-candidate-synthetic",
]
# Default-off G1.4 WASI component host. This exposes only the explicit CLI
# probe and never registers an arbitrary component MCP tool.
g14-wasi-component-runtime = ["dep:wasmtime", "dep:wasmtime-wasi"]
# Reserved marker for legacy Seed substrate UX. The AB runtime no longer links
# `ab-seed-bridge`; CLI/MCP surfaces report build-time disabled. Build the
# standalone `crates/seed-bridge` crate for historical replay experiments.
seed-substrate = []

[dependencies]
ab-core.workspace = true
ab-world-core.workspace = true
ab-notifier.workspace = true
ab-store.workspace = true
# read-only raw-embedding access for the continuity report (src/continuity.rs);
# same bundled-SQLite driver ab-store uses, so no new transitive cost.
tokio-rusqlite.workspace = true
ab-terminal.workspace = true
ab-browser.workspace = true
ab-agent.workspace = true
ab-mcp.workspace = true
ab-oob-alert.workspace = true
base64.workspace = true
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2 = "0.10"
thiserror.workspace = true
anyhow.workspace = true
tokio.workspace = true
futures.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
clap.workspace = true
walkdir.workspace = true
uuid.workspace = true
wasmtime = { workspace = true, optional = true }
wasmtime-wasi = { workspace = true, optional = true }

# v20: HTTP daemon for cross-machine forum + presence over Tailscale
axum = "0.7"
# v20 Stage 2: HTTP client for `peer:` arg routing.
# default-features=false drops the native-tls dep; rustls-tls is needed
# for the Tailscale REST API (api.tailscale.com over HTTPS — see
# tailscale_api.rs); peer-to-peer tailnet calls themselves are plain HTTP.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
# Sync HTTP client for RemoteEmbedBackend (tiered embedding delegation): the
# EmbeddingBackend::embed() trait method is sync and is called from tokio worker
# threads, where reqwest::blocking would panic (nested runtime). ureq uses raw
# blocking sockets — no runtime. localhost http only for now; add features=["tls"]
# when a Tier-3 https cloud /embed endpoint is introduced.
ureq = { version = "2", default-features = false }
# C2 lockfile primitive (kill(pid, 0) liveness probe).
libc = "0.2"
png = "0.17"

[target.'cfg(target_os = "linux")'.dependencies]
smithay-client-toolkit = { version = "0.20", optional = true }
wayland-client = { version = "0.31", optional = true }

[dev-dependencies]
tempfile = "3"

[[bin]]
name = "agent-bridge"
path = "src/main.rs"
